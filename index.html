b>達到一定損失才理賠，A 錯誤。","45028":"優勢：理賠條件客觀、無須訪查實際損失（甲、丙）。","45029":"以降水量門檻理賠＝<b>參數型天氣保險</b>。","45030":"番石榴農作物保險屬<b>參數型天氣保險</b>。","45031":"將污染風險轉嫁＝<b>環境污染責任保險</b>。","45032":"節能保險、乾淨能源 ETF、永續連結貸款、綠色信用卡<b>皆是</b>永續金融商品。","45033":"<b>減少運輸風險</b>不是共享經濟保險屬綠色保險的原因。","45034":"以生態指標為觸發、理賠專用於生態修復＝最符合參數型生物多樣性保險。","45035":"依健康行為給予保費折扣＝<b>外溢保單</b>。","46001":"對外宣稱綠色、實際造成重大環境影響＝<b>漂綠行為</b>。","46002":"使用<b>模糊或籠統</b>字樣可能被視為漂綠。","46003":"應<b>定期</b>審視正確性，A「不定期」錯誤。","46004":"防漂綠原則：聲明<b>簡單易懂</b>、避免難懂術語。","46005":"防漂綠指引目的<b>不是</b>加強永續金融商品行銷。","46006":"應避免在基金銷售網頁中永續商品與一般商品<b>混在一起</b>。","46007":"宜注意正確性、完整性、可比較性<b>皆是</b>。","46008":"防範漂綠：聲明應提供<b>公平的比較基準</b>。","46009":"漂綠是缺乏證據、誇大、無法理解；<b>全面完整揭露正負面影響</b>不是。","46010":"採碳抵換卻<b>未公開說明</b>最可能違反防漂綠指引。"};
const NOTES={"11": "<h3>一、金融與永續的基本概念</h3><ul><li><b>綠天鵝事件 Green Swan Event</b>：<b>BIS 國際清算銀行 Bank for International Settlements</b> 於 2020 年提出；指<b>氣候變化與環境風險</b>可能引發<b>系統性金融危機</b>。特別之處：風險未來很可能發生、可能對人類生存構成威脅、會引發更複雜且不可測的連鎖反應（三項皆是）。與「黑天鵝」（難預測的意外）不同，綠天鵝是<b>幾乎可確定會發生</b>的氣候風險。</li><li><b>ESG</b>＝Environmental 環境、Social 社會、Governance <b>公司治理</b>（G 不是政府、全球）；<b>「政府保護」不在 ESG 內</b>。</li><li><b>UNEP 聯合國環境規劃署（United Nations Environment Programme）</b>將永續金融涵蓋面向定義為<b>環境、社會、經濟、治理</b>。</li><li>環境面向含<b>綠色金融、低碳金融、氣候金融</b>；<b>數位金融不屬環境面向</b>。</li><li><b>低碳金融</b>聚焦「氣候變遷<b>減緩</b>」（不含調適、公司治理、社會）；<b>綠色金融</b>關注降低溫室氣體、減少氣候衝擊、減緩環境負面風險，<b>不含「關懷社會弱勢權益」</b>（那是社會面向）。</li></ul><h3>二、金融業的角色</h3><ul><li>讓企業與投資人重視永續：<b>將 ESG 納入投融資授信參考</b>、提供 ESG 投資商品、提供綠色轉型貸款（三者皆是）；<b>「提高貸款利率懲罰」「鼓勵短期盈利最大化」不是合理做法</b>。</li><li>永續投資中金融業角色：符合股東及社會長期最佳利益、引導資金流向永續發展項目、協助不利永續發展之產業轉型（三者皆是）。</li><li>ESG 納入營運機制的用意：投融資授信參考、引導企業與投資人重視永續、提升競爭力；<b>不是</b>鼓勵短期獲利與高風險投資。</li><li>落實 2050 淨零：金融業<b>絕大多數碳排來自客戶（投融資排放）</b>，應發揮金融影響力、提供資金協助客戶轉型；「金融業本身應發揮大戶本業節能減碳」為題庫視為<b>有誤</b>的敘述（重點在客戶與投融資）。</li></ul><h3>三、淨零排放與碳定價</h3><ul><li><b>淨零排放 Net Zero</b>≠完全等同碳中和；<b>碳中和 Carbon Neutrality</b>＝透過<b>減量、移除、抵換</b>使大氣中 CO₂ 排放與吸收<b>正負抵銷</b>。即使馬上停止排放，大氣溫度也不會短期大幅下降。</li><li><b>碳交易</b>：政府建置平台供需交易；碳價由市場決定；分<b>強制性與自願性</b>兩種市場；「政府必須訂排放上限才能促成交易」被題庫視為錯誤（自願市場不需要總量上限）。碳交易平台目的：提供供需交易、形成碳價、引導降低排放；<b>不是讓企業完全取代實質減碳</b>。</li><li>三種碳定價機制，政府介入程度<b>由高到低：碳費（碳稅）→ 碳交易 → 企業內部碳定價</b>；<b>企業內部碳定價</b>政府介入最低。內部碳定價方式：<b>內部影子碳價、內部碳交易、內部碳費</b>；<b>「強制管制排放總量」不是</b>。</li><li><b>碳費 vs 碳稅</b>：都是政府向排碳者收固定費用；<b>碳稅屬政府總體稅收</b>，用途不限氣候領域；<b>碳費須專款專用於氣候減碳</b>。題庫的錯誤敘述＝「碳稅由環境部收取、碳費由財政部收取」（實際碳稅財政部、碳費環境部，題目顛倒）。</li></ul><h3>四、再生能源（《再生能源發展條例》）</h3><ul><li>我國推動再生能源的主要法源＝<b>再生能源發展條例</b>（不是廢棄物清理法、溫管法）。</li><li>涵蓋：太陽能、風能、生質能、地熱能、海洋能、<b>非抽蓄式水力（小水力）</b>、燃料電池等；<b>一般事業廢棄物直接利用所產生之能源亦屬涵蓋</b>（依書中答案：甲、乙、丁）；<b>抽蓄式水力、天然氣</b>不在其內。</li><li>定義：地熱能＝地表以下蘊含於岩石或溫泉之能源；離岸風力＝設置於<b>低潮線以外海域</b>；燃料電池＝氫氣與氧氣化學反應轉電能；「氫能係指利用<b>不分種類</b>的電力分解水產生之氫氣」為題庫視為錯誤敘述。</li><li>推動策略：<b>太陽光電＋離岸風電</b>為主軸；<b>「暫緩高風險離岸風電計畫」是錯的</b>；太陽光電分屋頂型、地面型；<b>離岸風電三階段：示範獎勵、潛力場址、區塊開發</b>。</li><li><b>用電大戶條款</b>：契約容量 <b>5,000 瓩以上</b>；須設置契約容量 <b>10%</b> 的再生能源設備；可購買再生能源電力與憑證履行；<b>亦可繳納代金</b>取代義務（題庫「無法繳納」為錯誤敘述）。</li></ul><h3>五、循環經濟</h3><ul><li>循環經濟：藉物質循環產生更高經濟價值（相對於「開採、製造、使用、丟棄」的線性經濟）。</li><li>商業模式例：<b>燈具以租代買、共享單車 Ubike、認證二手機買賣</b>；<b>建置線上購物平台不是</b>循環經濟。</li><li>我國政策：<b>五加二產業創新計畫、循環經濟推動方案、臺灣 2050 淨零轉型十二項關鍵戰略</b>（皆是）。</li></ul><h3>六、SDGs 聯合國永續發展目標（重點對應）</h3><div style=\"overflow-x:auto\"><table style=\"border-collapse:collapse;font-size:.88em;width:100%\"><tr><th style=\"border:1px solid #f0dfe3;background:#fde8ee;padding:4px\">目標</th><th style=\"border:1px solid #f0dfe3;background:#fde8ee;padding:4px\">重點與陷阱</th></tr><tr><td style=\"border:1px solid #f0dfe3;padding:4px\">目標 3 健康與福祉</td><td style=\"border:1px solid #f0dfe3;padding:4px\">減少傳染病、基本醫療服務</td></tr><tr><td style=\"border:1px solid #f0dfe3;padding:4px\">目標 7 可負擔的潔淨能源</td><td style=\"border:1px solid #f0dfe3;padding:4px\">增加電力供應／能源普及、提高再生能源比率、潔淨能源研發；<b>科技創新與數位應用不在此目標</b></td></tr><tr><td style=\"border:1px solid #f0dfe3;padding:4px\">目標 10 減少不平等</td><td style=\"border:1px solid #f0dfe3;padding:4px\">提高弱勢收入、公平機會、降低貧窮；<b>言論自由與媒體發言空間不在此目標</b></td></tr><tr><td style=\"border:1px solid #f0dfe3;padding:4px\">目標 12 責任消費與生產</td><td style=\"border:1px solid #f0dfe3;padding:4px\">綠色產品與技術、資訊提供與人才培育、推廣永續消費；<b>推動生態旅遊不在此目標</b></td></tr></table></div><h3>七、利害關係人理論 Stakeholder Theory</h3><ul><li>企業應創造<b>長期價值</b>並綜合考量<b>所有利害關係人</b>（股東、員工、顧客、供應商、社區、社會、環境）；<b>「極大化股東利潤為終極目標」是股東至上論，與此理論相反</b>。</li><li>應用有助於<b>可持續發展與長期成功</b>；確保企業價值與社會價值吻合。</li></ul>", "12": "<h3>一、臺灣 2050 淨零排放路徑（國家發展委員會發布）</h3><ul><li><b>四大轉型</b>：<b>能源轉型、產業轉型、生活轉型、社會轉型</b>；<b>科技轉型不在其中</b>。</li><li><b>二大治理基礎</b>：<b>科技研發、氣候法制</b>。</li><li>以<b>十二項關鍵戰略</b>整合跨部會資源；<b>綠色金融</b>是重要戰略之一；並<b>有考慮</b>弱勢族群面臨的轉型挑戰（公正轉型，「暫未考慮」為錯）。</li><li>產業轉型（製造部門）三大面向：<b>製程改善、能源轉換、循環經濟</b>（不是產業對話；也不是「減少使用天然氣及生質燃料」）。</li><li>生活轉型內容：新舊建物淨零循環建築、低碳（零廚餘）飲食習慣、「使用」取代「擁有」；<b>「提高轉型社會之韌性」屬社會轉型</b>。</li></ul><h3>二、氣候變遷因應法</h3><ul><li><b>2050 淨零排放目標入法</b>；減碳治理層級提高至<b>國家永續發展委員會</b>；穩健推動碳定價（有效降低排放的政策工具）與碳交易；優化碳盤查法規與系統。<b>「碳稅專款專用」不是</b>重點內容（專款專用是碳費）。</li><li>碳定價規劃：<b>徵收碳費＋推動碳交易</b>；碳費對<b>直接與間接排放源</b>徵收。</li><li>碳費相關子法：<b>碳費收費辦法、自主減量計畫管理辦法、碳費徵收對象溫室氣體減量指定目標</b>；<b>「溫室氣體自願減量專案管理辦法」不是碳費子法</b>（屬碳交易）。</li><li>碳交易：鼓勵<b>自願減量</b>並給予減量額度；額度可公開、移轉、交易、拍賣；<b>由政府建置平台（非民間）</b>；期望減碳績效有價化；<b>我國現行為自願減量額度交易</b>。</li></ul><h3>三、上市櫃公司永續發展行動方案（金管會）</h3><ul><li>五大面向：深化企業永續治理文化、強化利害關係人溝通、精進永續資訊揭露、提升永續資訊品質、推動 ESG 評鑑及數位化（題庫另有「引領企業淨零」主題）。</li><li>深化治理文化：2023 年起 <b>IPO 公司至少 1 位不同性別董事</b>；<b>興櫃公司</b>推動採候選人提名制（屬治理，不屬揭露面向）。</li><li>擴大揭露範圍：<b>2025 年起 20 億元以下公司</b>編製永續報告書；提升品質：<b>2024 年起抽查確信工作底稿</b>；強化溝通：<b>股東會 30 日前上傳議事手冊、14 日前上傳年報</b>。</li></ul><h3>四、上市櫃公司永續發展路徑圖（溫室氣體盤查與確信時程）</h3><ul><li>性質：設定<b>溫室氣體盤查資訊揭露時程</b>；依<b>實收資本額</b>自 <b>2023 年</b>起分階段；揭露<b>範疇一（直接）＋範疇二（能源間接）</b>，<b>不含範疇三</b>；盤查與確信範圍分階段擴大至<b>與合併財務報表相同</b>；預計 <b>2027 年</b>全體上市櫃完成盤查、<b>2029 年</b>完成確信。</li></ul><div style=\"overflow-x:auto\"><table style=\"border-collapse:collapse;font-size:.88em;width:100%\"><tr><th style=\"border:1px solid #f0dfe3;background:#fde8ee;padding:4px\">對象</th><th style=\"border:1px solid #f0dfe3;background:#fde8ee;padding:4px\">個體盤查</th><th style=\"border:1px solid #f0dfe3;background:#fde8ee;padding:4px\">確信</th><th style=\"border:1px solid #f0dfe3;background:#fde8ee;padding:4px\">合併子公司盤查</th><th style=\"border:1px solid #f0dfe3;background:#fde8ee;padding:4px\">確信</th></tr><tr><td style=\"border:1px solid #f0dfe3;padding:4px\">資本額 ≥100 億＋鋼鐵、水泥業</td><td style=\"border:1px solid #f0dfe3;padding:4px\">2023 個體盤查</td><td style=\"border:1px solid #f0dfe3;padding:4px\">（確信：2024 完成確信不在時程內）</td><td style=\"border:1px solid #f0dfe3;padding:4px\">2025 合併子公司盤查（114 年揭露）</td><td style=\"border:1px solid #f0dfe3;padding:4px\">—</td></tr><tr><td style=\"border:1px solid #f0dfe3;padding:4px\">資本額 50～100 億</td><td style=\"border:1px solid #f0dfe3;padding:4px\">2025 個體盤查</td><td style=\"border:1px solid #f0dfe3;padding:4px\">2027 個體確信</td><td style=\"border:1px solid #f0dfe3;padding:4px\">2026 合併子公司盤查（115 年揭露）</td><td style=\"border:1px solid #f0dfe3;padding:4px\">—</td></tr><tr><td style=\"border:1px solid #f0dfe3;padding:4px\">資本額 ≤50 億</td><td style=\"border:1px solid #f0dfe3;padding:4px\">2026 個體盤查</td><td style=\"border:1px solid #f0dfe3;padding:4px\">2028 個體確信</td><td style=\"border:1px solid #f0dfe3;padding:4px\">2027 合併子公司盤查</td><td style=\"border:1px solid #f0dfe3;padding:4px\">2029 合併子公司確信</td></tr></table></div><ul><li>2027 年須完成確信者：資本額 100 億以上（鋼鐵、水泥）合併子公司、50～100 億個體公司；<b>50 億以下合併子公司不在 2027</b>（為 2029）。</li></ul><h3>五、上市上櫃公司永續發展實務守則</h3><ul><li>目的：凸顯我國企業重視永續發展並致力實踐；管理公司對<b>經濟、環境、社會風險與影響</b>；由<b>董事會</b>督促實踐，並充分考量<b>利害關係人</b>利益；管理層策略定期向<b>董事會</b>報告。</li><li>發展永續環境：提升能源使用效率、使用<b>環境負荷衝擊低</b>的再生物料（不是高）、設環境管理專責單位或人員並定期辦教育；水資源、溫室氣體、廢棄物管理政策；<b>「強制採綠色產品開發」「全數換氫能車」不在其內</b>。</li><li>維護社會公益：尊重消費者權益、強化供應鏈管理、保障員工合法權益；<b>溫室氣體統計與社會公益「較無關」屬錯誤敘述</b>。</li><li><b>永續發展委員會</b>：人數不得少於 <b>3 人</b>；<b>「所有獨立董事都必須參與」是錯的</b>；得指派高階經理人擔任<b>永續長</b>；可組跨部門小組（公司治理、永續環境、社會公益、永續資訊揭露小組）；職權：制定推動永續政策與年度計畫、檢討追蹤執行成效、督導永續報告相關工作；<b>審議財務報告不屬其職權</b>。</li><li>2024 年金管會修正「公開發行公司建立內部控制制度處理準則」：強化水資訊管理與可靠性，<b>不是鬆綁</b>要求。</li></ul><h3>六、綠色及轉型金融行動方案</h3><ul><li><b>轉型金融</b>＝協助<b>高碳排產業客戶</b>訂定完整減碳轉型計畫以實現淨零。</li><li>五大核心策略：協力政府與企業推動淨零轉型、引導民間資金支持永續基礎建設、發揮金融影響力及提升國際能見度…；<b>「限制金融機構投融資高碳排產業」不是</b>。</li><li>六大推動面向：<b>資金、資料、揭露、培力、生態</b>…；<b>「布局」不是</b>；<b>建置我國綠色證券認證制度＝資金面向</b>（依書中答案）；<b>蒐集建置企業碳排平均數據資料庫</b>不屬「揭露」面向措施；揭露面向措施：綠色及轉型金融資訊揭露、參考 <b>TNFD</b> 擴編揭露、強化永續報告書與優化財務碳排資訊。</li><li>生態推動措施：永續金融先行者聯盟、金融業淨零推動工作平台、精進永續金融評鑑；<b>「綠色金融行動方案 3.0 全數中止」是錯的</b>。</li></ul><h3>七、臺灣永續經濟活動認定參考指引（第二版）與轉型計畫</h3><ul><li>指引訂定<b>六項環境目的</b>；經濟活動分<b>一般經濟活動、支持型經濟活動</b>兩類；第二版涵蓋 <b>5 產業、共 29 項</b>活動——<b>並非涵蓋國內所有產業，也非全部產業都須適用</b>。</li><li>條件：<b>對至少一項環境目的具實質貢獻＋未對六項環境目的造成重大危害（DNSH）</b>；判斷 DNSH：<b>未因違反相關法規而受目的事業主管機關重大裁處</b>（不是有無揭露碳排或編製報告書）。判斷永續程度的類型四種：<b>符合、轉型中、不符合、不適用</b>。</li><li>「轉型計畫建議涵蓋事項」之治理面向：推定單位與程序、監督方式、執行單位與控制程序；<b>「氣候變遷減緩相關指標」不屬治理面向</b>（屬指標與目標）。</li></ul>", "13": "<h3>一、聯合國氣候談判歷程（時間軸）</h3><div style=\"overflow-x:auto\"><table style=\"border-collapse:collapse;font-size:.88em;width:100%\"><tr><th style=\"border:1px solid #f0dfe3;background:#fde8ee;padding:4px\">年</th><th style=\"border:1px solid #f0dfe3;background:#fde8ee;padding:4px\">事件</th><th style=\"border:1px solid #f0dfe3;background:#fde8ee;padding:4px\">重點</th></tr><tr><td style=\"border:1px solid #f0dfe3;padding:4px\">1972</td><td style=\"border:1px solid #f0dfe3;padding:4px\">斯德哥爾摩人類環境會議（聯合國首次環境問題會議）</td><td style=\"border:1px solid #f0dfe3;padding:4px\"><b>斯德哥爾摩宣言</b></td></tr><tr><td style=\"border:1px solid #f0dfe3;padding:4px\">1988</td><td style=\"border:1px solid #f0dfe3;padding:4px\"><b>IPCC</b> 成立（UNEP＋WMO 共同）</td><td style=\"border:1px solid #f0dfe3;padding:4px\">評估人為氣候變遷；已發布 <b>6 次評估報告</b></td></tr><tr><td style=\"border:1px solid #f0dfe3;padding:4px\">1992</td><td style=\"border:1px solid #f0dfe3;padding:4px\">聯合國環境與發展會議 UNCED（里約）</td><td style=\"border:1px solid #f0dfe3;padding:4px\">提出 <b>UNFCCC 氣候變遷綱要公約</b>；1995 起每年召開 COP</td></tr><tr><td style=\"border:1px solid #f0dfe3;padding:4px\">1997</td><td style=\"border:1px solid #f0dfe3;padding:4px\"><b>京都議定書</b></td><td style=\"border:1px solid #f0dfe3;padding:4px\"><b>第一個要求具體減排</b>的協議；CBDR；已開發國家先行；京都機制（碳排放交易 ET）</td></tr><tr><td style=\"border:1px solid #f0dfe3;padding:4px\">2015</td><td style=\"border:1px solid #f0dfe3;padding:4px\"><b>巴黎協定</b></td><td style=\"border:1px solid #f0dfe3;padding:4px\">首個涵蓋所有國家；NDC；升溫控制 <b>2°C 內、努力 1.5°C</b></td></tr><tr><td style=\"border:1px solid #f0dfe3;padding:4px\">2021</td><td style=\"border:1px solid #f0dfe3;padding:4px\">COP26 格拉斯哥氣候公約</td><td style=\"border:1px solid #f0dfe3;padding:4px\">NDC 改<b>每年</b>檢視（題庫）；首次寫入<b>逐步減少（phase down）煤炭與化石燃料補貼</b></td></tr><tr><td style=\"border:1px solid #f0dfe3;padding:4px\">2022</td><td style=\"border:1px solid #f0dfe3;padding:4px\">COP27</td><td style=\"border:1px solid #f0dfe3;padding:4px\">富裕國家首度同意設立<b>損失與損害基金 Loss and Damage</b></td></tr></table></div><h3>二、IPCC 與評估報告</h3><ul><li><b>IPCC 聯合國政府間氣候變遷專門委員會</b>：由 <b>UNEP 與 WMO</b> 共同成立；從科學、技術、社會經濟觀點，對<b>人為起源</b>的氣候變化、影響、適應與緩和作綜合評價；提供<b>科學評估報告 Assessment Report</b>（不做政策決定，也不揭露碳排）。</li><li><b>AR6 綜合報告（2023 年 3 月）</b>：強調氣候變遷、人類社會、生態系統的互動；呼籲落實<b>巴黎協定</b>，2030 年前全球溫室氣體減量<b>約一半</b>；2050 年初期達<b>淨零排放</b>則有 50% 機會將升溫控制在 1.5°C 內。</li></ul><h3>三、UNFCCC 氣候變遷綱要公約</h3><ul><li>簽署國稱<b>締約國 Parties</b>（大會＝COP，Conference of the Parties）；公約<b>對個別締約國無具體義務與法律約束力</b>，但<b>可在後續議定書設定規範或限制</b>；各年度會議協議成為國際氣候治理的重要依據。</li><li><b>附件一</b>＝已工業化與正在朝市場經濟過渡的國家，應制定國家政策與措施減緩氣候變化；<b>附件二</b>＝OECD 成員，另負責提供開發中國家資金與技術援助。</li></ul><h3>四、京都議定書 vs 巴黎協定</h3><div style=\"overflow-x:auto\"><table style=\"border-collapse:collapse;font-size:.88em;width:100%\"><tr><th style=\"border:1px solid #f0dfe3;background:#fde8ee;padding:4px\">項目</th><th style=\"border:1px solid #f0dfe3;background:#fde8ee;padding:4px\">京都議定書</th><th style=\"border:1px solid #f0dfe3;background:#fde8ee;padding:4px\">巴黎協定</th></tr><tr><td style=\"border:1px solid #f0dfe3;padding:4px\">減排承諾對象</td><td style=\"border:1px solid #f0dfe3;padding:4px\">僅已開發國家（附件一）</td><td style=\"border:1px solid #f0dfe3;padding:4px\">已開發＋開發中，全球共同</td></tr><tr><td style=\"border:1px solid #f0dfe3;padding:4px\">治理模式</td><td style=\"border:1px solid #f0dfe3;padding:4px\">由上而下（Top-Down）分配</td><td style=\"border:1px solid #f0dfe3;padding:4px\">由下而上：各國提出<b>國家自主貢獻 NDC</b></td></tr><tr><td style=\"border:1px solid #f0dfe3;padding:4px\">原則</td><td style=\"border:1px solid #f0dfe3;padding:4px\"><b>共同但有差異責任 CBDR</b>，已開發國家先行</td><td style=\"border:1px solid #f0dfe3;padding:4px\">各依狀況與能力，每 <b>5 年</b>提交更新 NDC</td></tr><tr><td style=\"border:1px solid #f0dfe3;padding:4px\">溫度目標</td><td style=\"border:1px solid #f0dfe3;padding:4px\">—</td><td style=\"border:1px solid #f0dfe3;padding:4px\">低於工業化前 2°C，努力 <b>1.5°C</b></td></tr><tr><td style=\"border:1px solid #f0dfe3;padding:4px\">機制</td><td style=\"border:1px solid #f0dfe3;padding:4px\">京都機制含<b>碳排放交易 ET</b></td><td style=\"border:1px solid #f0dfe3;padding:4px\">已開發國家提供資金協助開發中國家減緩與調適</td></tr></table></div><div class=\"trap\">「巴黎協定重要內容正確的有幾項」答案 1 項：巴黎採<b>由下而上</b>非由上而下；「2030 減碳 50%＋2050 碳中和」為 IPCC 建議而非協定條文；正確者為「已開發國家提供資金協助開發中國家」。</div><h3>五、COP26／COP27</h3><ul><li><b>COP27</b>：史上首度富裕國家同意設立基金，補償氣候脆弱國家的<b>損失與損害</b>；依書中答案：僅 II 正確，共 <b>1 項</b>。<b>COP26 格拉斯哥氣候公約</b>：逐步減少煤炭與化石燃料補貼。</li></ul><h3>六、歐盟永續分類標準 EU Taxonomy Regulation</h3><ul><li>2020 年 6 月發布、7 月 12 日生效；規範<b>經濟活動</b>是否符合環境永續（評估主體從「企業」轉向「經濟活動」）；成為多數國家制定標準的參考；目的：達成歐洲綠色政綱、協助低碳轉型、引導資金至永續活動；<b>不是辨識社會永續性</b>。</li><li>三項條件：<b>對六大環境目標至少一項有重大貢獻、不對其他目標造成重大損害（DNSH）、遵守最低限度社會保障</b>；<b>「保持最低獲利」不是條件</b>；不需要對六項全部有貢獻。</li><li>六大環境目標：氣候變遷減緩、氣候變遷調適、水及海洋資源永續利用與保護、轉型至循環經濟、污染預防與控制、生物多樣性與生態系統保護與復原；<b>2023 年 6 月 13 日</b>公布另外 <b>4 項</b>（水及海洋、循環經濟、污染預防、生物多樣性）的細項指引——<b>不屬於這 4 項的是「經濟成長與資源消耗脫鉤」</b>。</li><li><b>天然氣與核能</b>在有限度與嚴格條件下作為過渡能源，被納入分類。</li><li>強制揭露：資產管理公司報告其投資組合中投資於符合分類標準活動的<b>百分比</b>。</li></ul><h3>七、SFDR 永續金融揭露規範（Sustainable Finance Disclosure Regulation）</h3><ul><li>規範<b>投資公司、基金公司、保險公司等主要金融市場參與者</b>與財務顧問公開揭露所投資企業的 ESG 落實狀況，防止<b>漂綠</b>。</li><li>揭露義務：<b>特定前（合約前）揭露、階段（定期）報告、網站與說明書公開</b>；<b>不是每天揭露</b>；須揭露永續風險政策、<b>主要不利影響 PAIs</b>（Principal Adverse Impacts，屬「不利的永續性影響」）、產品級別揭露；<b>產品獲利性不是</b>。</li><li>基金分類：<b>Article 6（一般、未特別考慮永續）、Article 8（泛 ESG／淺綠，促進環境社會特徵）、Article 9（深綠，以永續投資為目標，須確認經濟活動實現 ESG 目標且無重大危害）</b>。須揭露碳足跡、溫室氣體排放等指標；<b>每天揭露</b>是錯的；依書中答案，Q53 選「僅規定在歐洲設有營運據點或販售商品的基金公司」（與一般說法不同，請核對）。</li></ul><h3>八、CSRD 企業永續報告指令（Corporate Sustainability Reporting Directive）</h3><ul><li>歐盟 ESG 資訊揭露<b>核心法規</b>，取代 <b>NFRD 非財務報表指令</b>；適用<b>上市公司與大型企業</b>；依 <b>ESRS 歐洲永續性報告標準</b>揭露；ESRS 由 <b>EFRAG 歐洲財務報導諮詢小組</b>制定。</li><li><b>雙重重大性 Double Materiality</b>：<b>影響重大性（企業對社會環境的影響）與財務重大性</b>同樣重要。</li><li>目的：評估氣候與永續議題帶來的財務風險與機會、與其他報告協調以降低中期報告成本；確保投資人與利害關係人取得評估企業<b>永續績效</b>資訊（題庫 065「僅財務資訊」為錯）。</li></ul><h3>九、CBAM 碳邊境調整機制（Carbon Border Adjustment Mechanism）與 EU ETS</h3><ul><li><b>EU ETS 歐盟排放交易系統</b>：<b>總量管制交易 cap-and-trade</b>，企業在總量下可獲一定比例<b>免費配額</b>；碳價受政策干預，並依<b>碳權憑證供需</b>以「污染者付費」激勵減排。</li><li><b>碳洩漏 Carbon Leakage</b>：企業因成本考量把碳排從 A 國移到 B 國。</li><li><b>CBAM</b>：生產地碳價低於 EU ETS 的產品進口到歐盟，須購買 <b>CBAM 憑證</b>補足差額；<b>過渡期結束後自 2026 年 1 月起正式付費</b>；永續簡化綜套案（Omnibus）豁免主要對象為<b>中小企業與個人進口商</b>。</li></ul>", "21": "<h3>一、先建立全局：六大揭露框架一次看</h3><div style=\"overflow-x:auto\"><table style=\"border-collapse:collapse;font-size:.88em;width:100%\"><tr><th style=\"border:1px solid #f0dfe3;background:#fde8ee;padding:4px\">框架</th><th style=\"border:1px solid #f0dfe3;background:#fde8ee;padding:4px\">關注重點</th><th style=\"border:1px solid #f0dfe3;background:#fde8ee;padding:4px\">主要對象</th><th style=\"border:1px solid #f0dfe3;background:#fde8ee;padding:4px\">關鍵字</th></tr><tr><td style=\"border:1px solid #f0dfe3;padding:4px\">GRI 全球永續性報告協會 Global Reporting Initiative</td><td style=\"border:1px solid #f0dfe3;padding:4px\">衝擊重大性（組織對經濟、環境、人群的衝擊）</td><td style=\"border:1px solid #f0dfe3;padding:4px\">所有利害關係人</td><td style=\"border:1px solid #f0dfe3;padding:4px\">不設績效好壞標準；適用任何產業</td></tr><tr><td style=\"border:1px solid #f0dfe3;padding:4px\">TCFD 氣候相關財務揭露工作小組</td><td style=\"border:1px solid #f0dfe3;padding:4px\">氣候相關風險與機會的財務影響</td><td style=\"border:1px solid #f0dfe3;padding:4px\">投資人、貸款機構、保險公司</td><td style=\"border:1px solid #f0dfe3;padding:4px\">FSB 召集；治理／策略／風險管理／指標和目標</td></tr><tr><td style=\"border:1px solid #f0dfe3;padding:4px\">SASB 永續會計準則委員會 Sustainability Accounting Standards Board</td><td style=\"border:1px solid #f0dfe3;padding:4px\">財務重大性</td><td style=\"border:1px solid #f0dfe3;padding:4px\">投資人</td><td style=\"border:1px solid #f0dfe3;padding:4px\">產業別指標；5 大面向、26 議題、77 行業、11 產業</td></tr><tr><td style=\"border:1px solid #f0dfe3;padding:4px\">ISSB 國際永續準則理事會 International Sustainability Standards Board</td><td style=\"border:1px solid #f0dfe3;padding:4px\">財務重大性</td><td style=\"border:1px solid #f0dfe3;padding:4px\">投資人</td><td style=\"border:1px solid #f0dfe3;padding:4px\">IFRS S1（一般）＋S2（氣候）；2021 COP26 成立</td></tr><tr><td style=\"border:1px solid #f0dfe3;padding:4px\">TNFD 自然相關財務揭露 Taskforce on Nature-related Financial Disclosures</td><td style=\"border:1px solid #f0dfe3;padding:4px\">自然相關風險與機會</td><td style=\"border:1px solid #f0dfe3;padding:4px\">投資人／金融機構</td><td style=\"border:1px solid #f0dfe3;padding:4px\">LEAP 方法；依賴與影響</td></tr><tr><td style=\"border:1px solid #f0dfe3;padding:4px\">GHG Protocol／ISO 14064-1</td><td style=\"border:1px solid #f0dfe3;padding:4px\">溫室氣體盤查</td><td style=\"border:1px solid #f0dfe3;padding:4px\">—</td><td style=\"border:1px solid #f0dfe3;padding:4px\">範疇一、二、三；ISO 14067 產品碳足跡</td></tr></table></div><div class=\"trap\">最常考的混淆：<b>「指標一致性、產業特定指標、指標可比性」三大特色屬於 SASB</b>，不是 GRI、也不是 TCFD；「治理／策略／風險管理／指標和目標」四要素屬於 <b>TCFD（並被 IFRS S1/S2 沿用）</b>。</div><h3>二、GRI 準則（Global Reporting Initiative Standards）</h3><ul><li>適用<b>任何產業</b>；基於永續發展定義「滿足當代需求，同時不損及後代滿足其需求」。</li><li>報導目的：組織透過活動與商業關係，對<b>經濟、環境、人群（含人權）</b>產生的衝擊；<b>負面衝擊與正面貢獻都要報導</b>（題庫：「只管負面、不要求正面」是錯的）。</li><li><b>不設定</b>分配、門檻、目標或評判好壞的績效標準。</li><li>GRI 2021 三大系列：<b>通用準則 Universal Standards、行業準則 Sector Standards、主題準則 Topic Standards</b>（不是環境／社會／經濟，也不是治理系列）。</li><li>通用準則：<b>GRI 1 基礎（使用 GRI 準則的要求與原則）、GRI 2 一般揭露（組織與其報導實務、活動、治理、策略、利害關係人）、GRI 3 重大主題（決定流程、重大主題列表、如何管理）</b>；三者皆須應用（不是任選）。</li><li>行業準則：組織依其行業使用，提供可能相關的重大主題資訊；<b>第一個行業準則為油氣／煤炭等高影響行業，不是金融業</b>。</li><li>所有組織都須決定重大主題；不同行業、同行業不同組織的重大主題數量與方法<b>並不相同</b>，方法依組織情況調整。</li></ul><h3>GRI 決定重大主題的流程</h3><ul><li>步驟：了解組織脈絡→識別實際與潛在衝擊→評估衝擊顯著性→排定優先順序。每步驟須<b>有文件記錄、可複製</b>不是「每三期更換一次」。</li><li>衝擊可以是<b>實際或潛在、正面或負面、短期或長期、可逆或不可逆、蓄意或非蓄意</b>。正面衝擊<b>可能是不可逆的</b>（不能限縮為僅實際或僅潛在）。</li><li>資訊來源：可用<b>組織自己或第三方的評估</b>、法律審查／反貪腐違規管理系統、職安衛調查、申訴機制、企業風險管理系統、內外部利害關係人、新聞機構與公民社會組織；<b>「組織內部成員的個人資訊」不是</b>（法律審查、反貪腐法遵、財務稽核、職安衛檢查文件皆是）。</li><li>企業風險管理系統<b>也含</b>對外部經濟、環境、人群的衝擊，不是只看組織自身風險。</li><li>資源有限時<b>優先識別負面衝擊</b>。無法識別的原因可能是價值鏈實體太多、全球業務多；無法識別者<b>不一定都是潛在衝擊</b>。</li><li>每個報導期間須重新檢視上期重大主題；衝擊變化可能來自<b>活動或商業關係</b>的改變。</li></ul><h3>依循 GRI 報導</h3><ul><li>須報導 GRI 2 所有揭露項目；只有在法律禁止、保密限制、資訊不可得等情況才可有<b>省略理由</b>；<b>「無行業準則」不是允許的省略理由</b>；<b>揭露項目 2-4 資訊重編不可省略</b>。</li><li>未能完全符合「依循（in accordance with）」要求，仍可用「參考（with reference to）」方式，並須：發布 GRI 內容索引、提供使用聲明、通報 GRI；也可為特定目的使用選定準則報導特定主題。</li><li>GRI 102（題庫指氣候相關新版）與 IFRS S2 的範疇一至三排放揭露視為<b>等效</b>，避免重複報告。</li></ul><h3>三、IFRS 永續揭露準則 S1／S2（ISSB）</h3><ul><li><b>ISSB 國際永續準則理事會</b>由 IFRS Foundation 於<b>2021 年 11 月 3 日 COP26</b> 宣布成立，<b>VRF 價值報導基金會併入</b>。目的：回應全球投資人對高品質永續資訊的需求；主要使用者＝<b>投資人</b>。</li><li>2023 年中發布 <b>S1（永續相關財務資訊一般要求）</b>、<b>S2（氣候相關揭露）</b>。</li><li>兩者皆參考 <b>TCFD 四大構面（治理、策略、風險管理、指標和目標）</b>與 <b>SASB 產業指引</b>；S2 要求依 SASB 準則產業特定揭露，並需考量價值鏈中的風險與機會。</li><li>S1 提供重大永續風險與機會的揭露指引，<b>題庫視「不得再以營業秘密為理由規避揭露」為錯誤敘述</b>；S1 對重大永續風險與機會提供揭露指引，<b>並未要求明確揭露永續與財務資訊間的關聯</b>（S1 參酌 TCFD 四大構面）。</li><li>S2 重點是<b>氣候</b>，不是涵蓋所有 ESG；並非只適用聯合國會員國。</li></ul><h3>四、TCFD 氣候相關財務揭露（Task Force on Climate-related Financial Disclosures）</h3><ul><li>由 <b>FSB 金融穩定委員會</b>受 <b>G20</b> 委託召集；制訂<b>自願性、一致的</b>氣候相關財務揭露，協助投資人、貸款機構、保險公司評估與定價風險。成員含大型銀行、保險公司、資產管理公司、退休基金、非金融公司、會計事務所、諮詢機構、信評機構。</li><li>FSB 認為充分資訊能<b>改善投資決策，也協助企業因應低碳轉型</b>（「無法協助」是錯的）。</li><li>機會類別：資源效率、能源來源、產品與服務、市場、<b>韌性 Resilience</b>；<b>商譽不是</b>。</li></ul><div style=\"overflow-x:auto\"><table style=\"border-collapse:collapse;font-size:.88em;width:100%\"><tr><th style=\"border:1px solid #f0dfe3;background:#fde8ee;padding:4px\">要素</th><th style=\"border:1px solid #f0dfe3;background:#fde8ee;padding:4px\">建議揭露事項</th><th style=\"border:1px solid #f0dfe3;background:#fde8ee;padding:4px\">一句話定義</th></tr><tr><td style=\"border:1px solid #f0dfe3;padding:4px\">治理 Governance</td><td style=\"border:1px solid #f0dfe3;padding:4px\">董事會監督＋管理階層角色（董事的支持與監督是關鍵）</td><td style=\"border:1px solid #f0dfe3;padding:4px\">組織與氣候相關風險機會的治理</td></tr><tr><td style=\"border:1px solid #f0dfe3;padding:4px\">策略 Strategy</td><td style=\"border:1px solid #f0dfe3;padding:4px\">短、中、長期風險與機會；對業務、策略、財務規劃的衝擊；不同情境下策略韌性</td><td style=\"border:1px solid #f0dfe3;padding:4px\">業務、策略與財務規劃的衝擊</td></tr><tr><td style=\"border:1px solid #f0dfe3;padding:4px\">風險管理 Risk Management</td><td style=\"border:1px solid #f0dfe3;padding:4px\">鑑別、評估、管理流程；是否整合至整體風險管理</td><td style=\"border:1px solid #f0dfe3;padding:4px\">如何鑑別、評估和管理氣候風險</td></tr><tr><td style=\"border:1px solid #f0dfe3;padding:4px\">指標和目標 Metrics & Targets</td><td style=\"border:1px solid #f0dfe3;padding:4px\">評估風險機會所用指標；範疇一、二、三排放；目標與績效</td><td style=\"border:1px solid #f0dfe3;padding:4px\">重大資訊的指標與目標</td></tr></table></div><ul><li><b>「三大特色：指標一致性、產業特定、可比性」是 SASB，不是 TCFD</b>；指標和目標項下揭露事項＝範疇一二三排放、目標與落實表現、評估所用指標（<b>「風險管理流程」屬風險管理</b>）。</li><li>財務影響分類：<b>損益表＝收入、支出；資產負債表＝資產和負債、資本和融資</b>。收入：碳定價與價格機制須納入考量（「還不用」是錯的），並識別新收入機會；支出：說明成本結構與調適彈性以證明投資潛力；資本和融資：可能<b>增加負債規模</b>補償營運現金流減少與新資本支出。</li></ul><div class=\"trap\">TCFD 口訣：<b>董事會／管理階層角色＝治理；短中長期風險機會、對業務策略財務規劃的衝擊、情境韌性＝策略；鑑別評估管理流程、整合至整體風險管理＝風險管理；指標、範疇一二三、目標＝指標和目標</b>。</div><h3>五、SASB 永續會計準則委員會（Sustainability Accounting Standards Board）</h3><ul><li>2018 年 11 月公布：<b>5 大面向、26 項一般 ESG 議題、77 個行業別（industry）、11 個產業別（sector）</b>；「20 項議題」是錯的。</li><li>目的：把影響財務狀況與營運績效的永續資訊，與財務資訊<b>共同揭露</b>，向<b>投資人</b>揭露<b>財務重大性</b>資訊；特性：<b>決策有用性、符合成本效益、可揭露真實資訊的開發流程</b>；<b>有特定行業分類</b>（不是全行業適用）。</li><li>三大特色：<b>指標一致性、產業特定指標、指標可比性</b>；一致性＝定義、範疇、計算方式、參考文獻、單位皆一致；「指標具明確投資指引」不是其特色。</li><li>制定程序＝<b>參照一般財務會計標準的流程</b>，與資本市場人士、專家學者廣泛討論。</li></ul><div style=\"overflow-x:auto\"><table style=\"border-collapse:collapse;font-size:.88em;width:100%\"><tr><th style=\"border:1px solid #f0dfe3;background:#fde8ee;padding:4px\">五大面向</th><th style=\"border:1px solid #f0dfe3;background:#fde8ee;padding:4px\">包含議題</th></tr><tr><td style=\"border:1px solid #f0dfe3;padding:4px\">環境 Environment（6）</td><td style=\"border:1px solid #f0dfe3;padding:4px\">溫室氣體排放 GHG Emissions、空氣品質、能源管理、水與廢水管理、廢棄物與有害物質管理、生態衝擊 Ecological Impacts</td></tr><tr><td style=\"border:1px solid #f0dfe3;padding:4px\">社會資本 Social Capital（7）</td><td style=\"border:1px solid #f0dfe3;padding:4px\">人權與社區關係、客戶隱私、資訊安全 Data Security、近用與可負擔性、產品品質與安全、客戶福利、合理的行銷與標示 Selling Practices & Product Labeling</td></tr><tr><td style=\"border:1px solid #f0dfe3;padding:4px\">人力資本 Human Capital（3）</td><td style=\"border:1px solid #f0dfe3;padding:4px\">勞工關係 Labor Practices、員工健康與安全、員工認同感／多樣性與包容性</td></tr><tr><td style=\"border:1px solid #f0dfe3;padding:4px\">商業模式與創新 Business Model & Innovation（5）</td><td style=\"border:1px solid #f0dfe3;padding:4px\">產品設計與生命週期管理、商業模式韌性、供應鏈管理、原料採購與效率 Materials Sourcing & Efficiency、氣候變遷實體衝擊</td></tr><tr><td style=\"border:1px solid #f0dfe3;padding:4px\">領導與治理 Leadership & Governance（5）</td><td style=\"border:1px solid #f0dfe3;padding:4px\">商業道德 Business Ethics、競爭行為、法規與監管環境管理、重大事故風險管理、系統風險管理</td></tr></table></div><ul><li><b>自然資本不是 SASB 面向</b>。<b>商業道德屬領導與治理，不屬社會資本</b>。</li><li>GHG 議題涉及企業監管風險、聲譽風險、環境合規；<b>不涉及員工個人減碳作為</b>。生態衝擊議題＝公司活動對生態系統與生物多樣性的影響（不是氣候變遷對生態的影響）。</li><li>人權與社區關係：社會經濟、社區參與、環境正義、當地勞動力培養等；空氣污染影響社區健康屬環境面／其他議題；近用與可負擔性、合理行銷屬其他議題。</li><li>勞工關係：涵蓋最低工資與福利、遵守勞動法規與國際規範、童工、與勞工組織及結社自由的關係。員工多樣性包容：企業文化、聘僱晉升、歧視（種族、性別、宗教、性取向）；<b>不含結社自由</b>（那是勞工關係內容）。</li></ul><h3>六、溫室氣體盤查（GHG Inventory）</h3><div style=\"overflow-x:auto\"><table style=\"border-collapse:collapse;font-size:.88em;width:100%\"><tr><th style=\"border:1px solid #f0dfe3;background:#fde8ee;padding:4px\">範疇</th><th style=\"border:1px solid #f0dfe3;background:#fde8ee;padding:4px\">定義</th><th style=\"border:1px solid #f0dfe3;background:#fde8ee;padding:4px\">例子</th></tr><tr><td style=\"border:1px solid #f0dfe3;padding:4px\">範疇一 Scope 1 直接排放</td><td style=\"border:1px solid #f0dfe3;padding:4px\">公司擁有或控制：固定／移動燃燒、製程、逸散</td><td style=\"border:1px solid #f0dfe3;padding:4px\">公務車、公司空調冷媒逸散、鍋爐、緊急發電機</td></tr><tr><td style=\"border:1px solid #f0dfe3;padding:4px\">範疇二 Scope 2 能源間接排放</td><td style=\"border:1px solid #f0dfe3;padding:4px\">外購電力、蒸氣、熱</td><td style=\"border:1px solid #f0dfe3;padding:4px\">台電電費＋大樓分攤電力（都算範疇二）</td></tr><tr><td style=\"border:1px solid #f0dfe3;padding:4px\">範疇三 Scope 3 其他間接排放</td><td style=\"border:1px solid #f0dfe3;padding:4px\">價值鏈其他活動</td><td style=\"border:1px solid #f0dfe3;padding:4px\">物料運輸、員工通勤、商務旅行、租賃、委外、金融業投融資組合</td></tr></table></div><ul><li>國際盤查涵蓋<b>範疇一、二、三</b>（不是只有兩種）。我國氣候變遷因應法七種溫室氣體：<b>CO₂、CH₄、N₂O、HFCs、PFCs、SF₆、NF₃</b>。</li><li>盤查四步驟：<b>決定排放量計算方式、蒐集活動數據、選擇合適排放係數、計算排放量</b>；不論依循何種規範，企業<b>都需界定盤查範圍</b>；金管會要求上市櫃盤查邊界<b>與財務報表</b>一致；但<b>環境部納管事業</b>的邊界是<b>管制編號所涵蓋地理邊界</b>，不必與財報一致；控制權法分營運控制、財務控制、股權比例。</li><li>ISO 14064-1:2018 基準年重新計算情形：報告或組織邊界變更、發現實質性錯誤、計算方法或排放係數變更；<b>設施生產水平改變（開、關廠、產量）不需重算</b>。</li><li>文件化與紀錄：邊界與原則、排放源識別、量化方式、數據選擇、彙總與資訊管理程序<b>都要文件化</b>；形式可紙本、硬碟、雲端，可供外部查證；不能只留會議紀錄。</li><li>常見規範：ISO 14064-1:2018、CNS 14064-1:2021、GHG Protocol（溫室氣體盤查議定書）；<b>PAS 2060 不是盤查規範</b>（是碳中和）。</li><li><b>ISO 14067</b>：產品碳足跡，影響類別＝<b>氣候變遷</b>；<b>ISO 14044</b>：碳足跡計算以<b>功能單位</b>為參考；服務型碳足跡生命週期階段為原料取得、服務、廢棄處理（<b>沒有「製造」</b>）；碳足跡報告揭露包含上述各階段。</li></ul><h3>七、TNFD 自然相關財務揭露（Taskforce on Nature-related Financial Disclosures）</h3><ul><li>四個揭露構面：<b>治理、策略、風險與影響管理、指標與目標</b>（<b>「依賴與影響」不是構面</b>，它是 LEAP 評價階段要識別的內容）。</li><li>附加指引：與原住民、在地社區及利害關係人議合、生物群落（biome）指引、情境分析；<b>數位轉型計畫不是</b>。</li><li><b>LEAP 方法</b>：<b>L 定位 Locate（與自然的介面）、E 評價 Evaluate（依賴與影響）、A 評估 Assess（風險與機會）、P 準備 Prepare（回應與報告）</b>；「範圍界定 Scoping」是分析開始前確定評估範圍的<b>準備工作</b>，兩個引導問題是<b>工作假設、協調目標與資源</b>。</li><li>情境分析：可用於評估重大自然相關風險與機會、辨識減緩措施，<b>TNFD 建議把它作為策略揭露的依據</b>，且不限短期。</li><li><b>依賴 Dependency</b>＝組織對自然資產／生態系統服務的依賴；<b>影響 Impact</b>＝組織對自然造成的正面或負面改變。</li></ul>", "22": "<h3>一、我國接軌 IFRS 永續揭露準則（金管會）</h3><ul><li>方式：<b>直接採用 adoption</b>（不是「台版永續準則」）；準則須經<b>金管會</b>認可後適用。</li><li>2023 年 8 月 17 日金管會宣布<b>全面接軌</b> IFRS 永續揭露準則；藍圖分<b>三階段</b>；<b>分階段</b>推動（不是全體同時）。</li><li>永續資訊須與<b>財務報表</b>連結；揭露於<b>股東會年報</b>（年報永續資訊專章強制納入），不是永續報告書／TCFD 報告。</li><li>IFRS 永續準則核心內容：<b>治理、策略、風險管理、指標與目標</b>（沒有「組織」）。</li></ul><div style=\"overflow-x:auto\"><table style=\"border-collapse:collapse;font-size:.88em;width:100%\"><tr><th style=\"border:1px solid #f0dfe3;background:#fde8ee;padding:4px\">階段</th><th style=\"border:1px solid #f0dfe3;background:#fde8ee;padding:4px\">適用對象</th><th style=\"border:1px solid #f0dfe3;background:#fde8ee;padding:4px\">編製</th><th style=\"border:1px solid #f0dfe3;background:#fde8ee;padding:4px\">揭露</th></tr><tr><td style=\"border:1px solid #f0dfe3;padding:4px\">第一階段</td><td style=\"border:1px solid #f0dfe3;padding:4px\">資本額 ≥ 100 億元</td><td style=\"border:1px solid #f0dfe3;padding:4px\">2026 年編製</td><td style=\"border:1px solid #f0dfe3;padding:4px\">2027 年對外揭露</td></tr><tr><td style=\"border:1px solid #f0dfe3;padding:4px\">第二階段</td><td style=\"border:1px solid #f0dfe3;padding:4px\">資本額 50 億～未達 100 億元</td><td style=\"border:1px solid #f0dfe3;padding:4px\">2027 年編製</td><td style=\"border:1px solid #f0dfe3;padding:4px\">2028 年揭露</td></tr><tr><td style=\"border:1px solid #f0dfe3;padding:4px\">第三階段</td><td style=\"border:1px solid #f0dfe3;padding:4px\">資本額 < 50 億元</td><td style=\"border:1px solid #f0dfe3;padding:4px\">2028 年編製</td><td style=\"border:1px solid #f0dfe3;padding:4px\">2029 年揭露</td></tr></table></div><div class=\"trap\">題庫 004 答案為 2026（最早適用者於哪一年度的年報須揭露，依題庫選 B）；資本額 100 億／50 億是切點。「最晚」＝50 億以下；「全體同時推動」＝錯誤。</div><h3>二、IFRS S2 氣候相關揭露：指標與目標</h3><ul><li><b>跨行業指標 cross-industry metrics（7 項）</b>：溫室氣體、氣候相關<b>轉型風險</b>、<b>實體風險</b>、氣候相關<b>機會</b>、<b>資本配置</b>、<b>內部碳價格</b>、<b>薪酬</b>。<b>能源使用量不在其中</b>（015）。</li><li>指標分三類：<b>跨行業指標、行業基礎指標（SASB 為基礎）、公司特定指標</b>；「<b>外部機構評比指標</b>」不是（013）。</li><li>行業基礎指標例：所有 IEC 62474 應申報物質之產品收入百分比（電子）；將 ESG 因素納入信用評分之作法（商業銀行）。</li><li>金融相關行業須揭露<b>範疇三第 15 類（投融資排放）</b>：<b>商業銀行、保險</b>（題庫 016 答 B：僅乙、丙）。</li><li>適用：暴露於氣候<b>實體風險、轉型風險</b>或可取得氣候<b>機會</b>之個體；「<b>無法合理預期將影響</b>個體」者不是適用範圍。</li></ul><h3>三、上市櫃公司永續資訊法規體系</h3><ul><li>金管會 2020 年 8 月公告<b>公司治理 3.0－永續發展藍圖</b>；強化 ESG 揭露參考 <b>SASB、TCFD</b>；<b>GRI 編製之 CSR 報告書對象為所有利害關係人，不足以判斷可能影響財務的資訊</b>，因此需進一步參考 SASB／TCFD（020 B 為錯誤敘述）。</li><li><b>「公開發行公司年報應行記載事項準則」附表二之二之二</b>（推動永續發展執行情形與守則差異）：環境議題含<b>氣候變遷風險機會評估、最近兩年溫室氣體、用水量、廢棄物總重量統計</b>；<b>有毒氣體排放量不在其中</b>；<b>「再生物料」不在兩年統計項</b>；<b>只有製造業須區分有害與非有害廢棄物</b>，<b>並非所有產業</b>。</li><li>推動項目：顧客健康與安全與隱私行銷標示、供應商環保勞動人權規範、合理員工福利；<b>「致力提升能源使用效率及使用環境負荷衝擊低之再生物料」屬環境議題，不屬社會議題</b>。</li><li>氣候相關揭露：<b>董事會與管理階層</b>監督治理氣候相關風險機會；須敘明氣候事件及轉型行動對財務影響、風險流程整合；<b>內部碳定價、科學基礎碳目標</b>屬非每一企業必要揭露事項。</li></ul><h3>四、永續報告書作業辦法（證交所／櫃買中心）</h3><ul><li>正式名稱：<b>上市上櫃公司編製與申報永續報告書作業辦法</b>；依 <b>GRI 通用準則、行業準則、重大主題準則</b>編製；氣候相關揭露參考 <b>TCFD</b>。</li><li>須編製：<b>食品、化學、金融保險</b>類上市櫃公司<b>不分資本額</b>；實收資本額達 20 億元以上者自 2023 年起編製（題庫 046）。</li><li><b>14 個產業</b>須揭露重大性且投資人關注之<b>水相關指標</b>；<b>電子通路業</b>屬 14 個產業之一，<b>建材營造業</b>不在其內（鋼鐵、電腦及週邊設備、油電燃氣在內）；14 個產業依<b>國內上市櫃公司產業類別</b>分類；須會計師確信者為食品、化學、金融保險，<b>光電業</b>不是。</li><li>溫室氣體揭露：近兩年度排放量（噸 CO₂e）、密度、涵蓋範圍、減量基準年與數據、確信情形；<b>「內部定價的價格」不在</b>；密度至少以<b>每百萬元營業額</b>計；<b>範疇三為自願揭露</b>；確信機構資訊須揭露。</li><li>常見標準：GHG Protocol、ISO 14064-1、ISAE 3410；<b>GRI 不是計算溫室氣體或確信標準</b>。</li><li>溫室氣體與確信資訊須於<b>股東會年報與永續報告書</b>揭露；<b>未要求</b>揭露於上市櫃公司官網永續發展專區；<b>IFRS S1 不在該辦法的要求範圍</b>。</li></ul><h3>五、金融業永續資訊揭露規範</h3><h3>證券業（證券期貨業永續發展轉型執行策略）</h3><ul><li>推動目標三項皆是：<b>完善永續生態體系、強化自律機制與整合資源、保障投資人或交易人權益及建構公平友善服務</b>。</li><li>集保在<b>基金觀測站</b>建置境外 ESG 基金專區並優化投信 ESG 基金專區。</li><li>證券期貨業溫室氣體應揭露範疇一及範疇二；<b>金融業投融資組合碳排屬範疇三（類別 15）</b>。</li></ul><div style=\"overflow-x:auto\"><table style=\"border-collapse:collapse;font-size:.88em;width:100%\"><tr><th style=\"border:1px solid #f0dfe3;background:#fde8ee;padding:4px\">對象</th><th style=\"border:1px solid #f0dfe3;background:#fde8ee;padding:4px\">時程</th></tr><tr><td style=\"border:1px solid #f0dfe3;padding:4px\">非上市櫃、實收資本額 ≥ 50 億之證券商</td><td style=\"border:1px solid #f0dfe3;padding:4px\">112 年</td></tr><tr><td style=\"border:1px solid #f0dfe3;padding:4px\">上市櫃公司子公司之證券商；20～50 億證券商</td><td style=\"border:1px solid #f0dfe3;padding:4px\">113 年</td></tr><tr><td style=\"border:1px solid #f0dfe3;padding:4px\">上市櫃公司子公司之綜合證券商溫室氣體盤查</td><td style=\"border:1px solid #f0dfe3;padding:4px\">與上市櫃母公司之時程一致</td></tr><tr><td style=\"border:1px solid #f0dfe3;padding:4px\">資產管理規模 < 3,000 億投信</td><td style=\"border:1px solid #f0dfe3;padding:4px\">115 年（編製永續報告書）</td></tr><tr><td style=\"border:1px solid #f0dfe3;padding:4px\">資產管理規模 < 1,000 億投信</td><td style=\"border:1px solid #f0dfe3;padding:4px\">119 年（溫室氣體盤查確信）</td></tr></table></div><ul><li>尚<b>未</b>納入期貨業資訊揭露時程者：<b>證券投資顧問事業</b>。</li></ul><h3>銀行業：本國銀行氣候風險財務揭露指引</h3><ul><li>揭露面向四項：<b>治理、策略、風險管理、指標與目標</b>。</li><li><b>治理</b>：董事會及高階管理階層將氣候風險納入<b>風險胃納、策略、營運計畫</b>；董事會有最終責任（氣候風險最高治理單位＝董事會）；<b>高氣候風險業務或交易須報經高階管理階層核定</b>並留存紀錄；董事會則負責核定氣候風險管理政策、策略與風險胃納；銀行<b>須</b>定期向董事會報告氣候風險資訊。</li><li><b>策略</b>：說明短、中、長期對營運、策略、產品、財務規劃之影響；規劃時至少考量<b>影響程度、發生頻率</b>（題庫 2059 答 A）；短期＝業務規劃期。</li><li><b>風險管理</b>：依<b>內部控制三道防線</b>劃分職責；可依<b>客戶或資產組合</b>訂評估方法：辨識高低、排序、定義重大風險；<b>依風險高低或次序執行「差異化」管理，不是一致措施</b>。</li><li>高氣候風險客戶管理考量：<b>風險重大性、客戶改善意願與能力、是否有抵減曝險替代做法</b>，全部皆是。</li><li><b>情境分析與壓力測試</b>：針對<b>轉型風險與實體風險</b>；情境須<b>前瞻性</b>（不是以歷史資料為主）；相關文件保存<b>至少 5 年</b>（情境選擇、模型假設與限制、實際應對行動；<b>參與人員名單不在其中</b>）。</li><li><b>指標與目標</b>：關鍵指標應考量影響期間，<b>優先遵循國內相關規範之溫室氣體計算方法</b>；指標不可隨意套用歷史數據；依指標訂目標並定期監控；進度落後須說明並提改善措施。</li></ul><h3>保險業：保險業氣候相關風險財務揭露指引</h3><ul><li>四大項：<b>治理機制、策略、風險管理機制、指標與目標</b>；<b>ESG 投資與風險管理之治理機制不是</b>（是投信投顧規範）。</li><li><b>每年</b>揭露，於<b>每年 3 月 31 日前</b>納入永續報告書或公司網站。</li><li>治理：董事會與高階管理階層監督；高階管理層<b>須定期向董事會報告</b>（不是僅重大事件才報）。訓練重點：確保董事會了解風險與機會並審視執行情形；「擔任講師」不是。</li><li>策略：識別對財務、業務、商品、投資影響；依重大性排序；訂年度目標與策略。</li><li>風險管理：風險管理與監控、情境分析與壓力測試、投資管理；針對<b>部門、客戶、交易對手</b>建立監控（不含競爭對手）；依三道防線；投資管理：評估及管理投資標的氣候風險、較高風險者<b>額外審查</b>、定期評估變動以調整部位。</li><li>與銀行指引共同重視：風險胃納納入氣候風險、情境分析、三道防線；<b>「設置永續投資研究部門」不是共同項</b>（屬投信投顧）。</li></ul><h3>投信投顧業：ESG 實務指引與氣候變遷資訊揭露指引</h3><ul><li><b>ESG 投資與風險管理作業流程暨 ESG 資訊揭露實務指引</b>面向：<b>治理機制、ESG 投資管理作業流程、資訊揭露</b>。</li><li><b>董事會</b>負最終責任；重大異常須立即採措施並提報<b>董事會</b>；高階管理層負責訂政策策略流程、檢視有效性、配置人力與訓練；<b>「進行永續投資研究與盡職治理調查」屬投資研究部門</b>，不是高階管理層。研究了解被投資公司環境保護、公司治理、社會責任，<b>不含財務績效</b>。</li><li>至少<b>每年</b>於永續報告書或網站發布 ESG 定期評估報告；與保險業共同重視「<b>定期評估投資標的所涉相關變動</b>」。</li><li>業務範疇含境外基金募集銷售、代理、全權委託；<b>承銷業務不是</b>。環境政策至少含<b>氣候變遷</b>議題。</li><li><b>證券投資信託事業氣候變遷資訊揭露指引</b>：管理層須有職掌、定期檢視目標；<b>不要求針對所有氣候風險訂定管理政策</b>；氣候策略韌性含低碳轉型計畫、情境調整、重大天然災害因應、氣候機會因子納入金融商品；<b>應揭露範疇一、二，範疇三亦須盤查揭露（不可說不需要）</b>；指標應含產品或投資策略之評估指標、投資決策指標、適合組織的方法。</li><li>大型投信額外要求：情境分析能力、評估過高碳排資產或產品、轉型與實體風險各階段；<b>「揭露評估短中長期風險的時間間隔」不是額外要求</b>。</li></ul>", "23": "<h3>第三方確信（Third-party Assurance）</h3><ul><li>提升永續報告書可靠度最具公信力：<b>委由會計師確信並出具確信報告</b>（優於切結書、官網公開、增加圖表）。</li><li>臺灣會計師規範：永續報告標的資訊確信依<b>確信準則 3000 號（非歷史性財務資訊查核或核閱之確信案件）</b>；<b>溫室氣體聲明依確信準則 3410 號</b>；審計準則 220、720 號與此無關。</li><li><b>標的 subject matter</b>＝依基準衡量或評估之項目；由<b>適當方（負責方）</b>衡量與評估並提出標的資訊，<b>確信報告由執業會計師出具</b>；執業人員<b>需了解標的與案件情況，並評估重大不實表達風險</b>。</li><li><b>不實表達 misstatement</b>＝標的資訊與依基準衡量所得結果之<b>差異</b>。</li><li>合理確信與有限確信結論均須說明<b>標的、適用基準、標的資訊</b>（題庫 D：以上皆須）。</li><li><b>有限確信 vs 合理確信</b>：主要差異在<b>可接受風險水準</b>——有限確信較高、確信程度較低；不是邊界大小、人數多寡，也不是「單一指標 vs 整份報告」。</li><li>上市公司溫室氣體個體範疇一、二資訊之第三方確信（非環境部納管事業）：可委託<b>經證交所及櫃買中心認可之會計師事務所</b>，依<b>確信準則 3410 號</b>執行；不是內部稽核，也不是任何機構做 ISO 14064-3 即可。</li></ul><div class=\"trap\">4 個易錯點：3000 vs 3410、有限與合理確信的差異在「風險水準」、不實表達＝「差異」、確信人員是「會計師」不是內稽。</div>", "31": "<h3>整體 ESG 風險概述（僅 5 題，考點集中）</h3><ul><li><b>生態保育</b>可減緩<b>環境風險</b>（不是文化、社會、治理風險）。</li><li>SDGs 17 項目標中：與<b>環境風險</b>關聯度<b>較低</b>者＝<b>消除貧窮</b>（潔淨水資源與衛生、可負擔的潔淨能源、氣候行動皆與環境高度相關）；與<b>治理風險</b>關聯度<b>較低</b>者＝<b>消除飢餓</b>（負責任消費與生產、性別平等、和平正義與有力的制度較相關）。</li><li><b>Swiss Re 瑞士再保險（2013）</b>：5 種天然災害指標分析全球 <b>616</b> 個都會區，臺灣風險最高＝<b>臺北都會區</b>。</li><li><b>劍橋大學風險管理研究中心</b>「2015–2025 城市風險指標」：對臺北造成經濟損失最大的風險＝<b>風暴（颱風）</b>。</li></ul><div class=\"trap\">題幹問「關聯度較低」時，選「最不相關」者；環境題選消除貧窮、治理題選消除飢餓。</div>", "32": "<h3>一、天氣、氣候與氣候變遷</h3><ul><li><b>天氣</b>＝短期的溫度、降雨機率、紫外線等狀況；<b>氣候</b>統計參考年期依 <b>WMO 世界氣象組織（World Meteorological Organization）</b>不少於 <b>30 年</b>。</li><li>UNFCCC 所指氣候變遷＝<b>人類活動</b>造成的趨勢（火山爆發、系統內部變化不算）。</li><li><b>IPCC</b> 隸屬<b>聯合國</b>，負責氣候變遷評估；三個工作小組：<b>第一組＝物理科學基礎；第二組＝衝擊、風險與調適；第三組＝減緩（減緩措施的治理選擇與社會接受度）</b>。</li></ul><h3>二、溫室氣體</h3><ul><li>是溫室氣體：<b>水蒸氣、CO₂、CH₄、N₂O</b>、氟化物；<b>氮氣不是</b>。我國溫管法管制七種，<b>臭氧不在其中</b>；IPCC 排放軌跡情境的關鍵 non-CO₂ 氣體＝甲烷、一氧化二氮、二氧化硫（氣溶膠），<b>臭氧不在情境內</b>；<b>三氟化氮（NF₃）</b>雖是我國管制的七種溫室氣體之一，但不在這些關鍵 non-CO₂ 因素之內。</li><li><b>CO₂</b>排放占比最高、可在大氣存在上百年、是優先移除目標；<b>CH₄ 暖化潛勢遠高於 CO₂</b>（100 年約<b>32 倍</b>，題庫）；<b>N₂O</b>近三分之二來自<b>農業</b>，自 1960 年代農業 N₂O 增加<b>約 100%</b>。</li><li>甲烷：土地最主要來源＝<b>畜牧業</b>；畜牧＋稻米合占約 <b>45%</b>；多吃素食少吃肉主要減少<b>甲烷</b>。</li></ul><h3>三、科學事實與數據（易考）</h3><ul><li>1850–1900 到 2010–2019 全球地表溫度上升最佳估計值＝<b>1.07°C</b>。</li><li>1979 至 1990 年代中期平流層下層變冷＝<b>平流層臭氧破壞</b>。</li><li>極端氣候頻率增加：熱浪、豪雨、乾旱；<b>寒流例外</b>。</li><li>1971–2018 海平面上升最大貢獻＝<b>海洋變暖熱膨脹</b>。</li><li>全球暖化現象：海水倒灌、極地冰融、暴雨乾旱沙漠化；<b>「陸地使用面積增加」不是</b>。</li><li>AR6：溫室氣體排放造成的海洋、冰層、全球海平面變遷在數世紀至數千年<b>不可逆</b>。</li><li>臺灣（2017 科學報告）：<b>夏季增長</b>；西北太平洋與侵臺颱風個數未來<b>減少</b>（但強度增強）；升溫 2°C 情境臺灣周邊海平面約上升 <b>0.5 公尺</b>。</li></ul><h3>四、情境：RCP 與 SSP</h3><div style=\"overflow-x:auto\"><table style=\"border-collapse:collapse;font-size:.88em;width:100%\"><tr><th style=\"border:1px solid #f0dfe3;background:#fde8ee;padding:4px\">情境</th><th style=\"border:1px solid #f0dfe3;background:#fde8ee;padding:4px\">重點</th></tr><tr><td style=\"border:1px solid #f0dfe3;padding:4px\">RCP8.5（最劣）</td><td style=\"border:1px solid #f0dfe3;padding:4px\">21 世紀末約 +3.7°C（題庫甲乙丙丁中選 +2.6 與 +3.7）</td></tr><tr><td style=\"border:1px solid #f0dfe3;padding:4px\">RCP2.6</td><td style=\"border:1px solid #f0dfe3;padding:4px\">可達成巴黎協定 <b>2°C</b> 以內</td></tr><tr><td style=\"border:1px solid #f0dfe3;padding:4px\">SSPx-y：y</td><td style=\"border:1px solid #f0dfe3;padding:4px\"><b>輻射強度</b>（W/m²）</td></tr><tr><td style=\"border:1px solid #f0dfe3;padding:4px\">SSP1-1.9</td><td style=\"border:1px solid #f0dfe3;padding:4px\">1.5°C 代表路徑</td></tr><tr><td style=\"border:1px solid #f0dfe3;padding:4px\">SSP3-7.0</td><td style=\"border:1px solid #f0dfe3;padding:4px\">21 世紀末<b>超過 2°C</b></td></tr><tr><td style=\"border:1px solid #f0dfe3;padding:4px\">SSP5-8.5</td><td style=\"border:1px solid #f0dfe3;padding:4px\">21 世紀中期（2041–2060）<b>很可能超過 2°C</b></td></tr></table></div><h3>五、氣候轉型風險與實體風險（TCFD 分類）</h3><div style=\"overflow-x:auto\"><table style=\"border-collapse:collapse;font-size:.88em;width:100%\"><tr><th style=\"border:1px solid #f0dfe3;background:#fde8ee;padding:4px\">類型</th><th style=\"border:1px solid #f0dfe3;background:#fde8ee;padding:4px\">例子</th></tr><tr><td style=\"border:1px solid #f0dfe3;padding:4px\">政策與法規風險</td><td style=\"border:1px solid #f0dfe3;padding:4px\">營運據點因法令改變位於生態保護區，需搬遷或因應→成本提升</td></tr><tr><td style=\"border:1px solid #f0dfe3;padding:4px\">技術風險</td><td style=\"border:1px solid #f0dfe3;padding:4px\">為減緩破壞開發新技術或設備→成本提升</td></tr><tr><td style=\"border:1px solid #f0dfe3;padding:4px\">市場風險</td><td style=\"border:1px solid #f0dfe3;padding:4px\">需求、原料價格改變</td></tr><tr><td style=\"border:1px solid #f0dfe3;padding:4px\">名譽（聲譽）風險</td><td style=\"border:1px solid #f0dfe3;padding:4px\">利害關係人對企業氣候行動的觀感影響需求、資金、招募；<b>營運破壞自然環境致形象受損</b></td></tr><tr><td style=\"border:1px solid #f0dfe3;padding:4px\">立即性實體風險 Acute</td><td style=\"border:1px solid #f0dfe3;padding:4px\">颱風、龍捲風、洪水、極端事件（如八八風災、卡努颱風、近期缺雨衝擊）</td></tr><tr><td style=\"border:1px solid #f0dfe3;padding:4px\">長期性實體風險 Chronic</td><td style=\"border:1px solid #f0dfe3;padding:4px\">海平面上升、全球暖化、夏季增長、土壤劣化、暖化致沿海房價下跌預期</td></tr></table></div><ul><li>題庫 2025：<b>「洪水」是立即性</b>；「極端多雨日數增加」是趨勢屬長期。2033：實體風險傳導金融風險途徑＝<b>基礎設施受損、政府借款條件變差</b>；石化業融資成本（轉型）與關稅戰（非氣候）<b>不是</b>。</li></ul><h3>六、高碳排產業與策略：減緩 vs 調適</h3><ul><li>高碳排：<b>電力供應、鋼鐵、水泥、石化、航空</b>；<b>金融業、食品業不是</b>；碳剔除策略最可能剔除<b>鋼鐵業</b>。</li><li><b>減緩 Mitigation（減少排放）</b>：多吃素、搭大眾運輸、碳捕捉利用、增加再生能源、減少食物浪費、廢棄物防治、造林植樹、太陽能；<b>調適 Adaptation（因應衝擊）</b>：加高堤防／防波堤、購買颱風洪水保險、遷居高處、種耐旱抗熱作物、海岸養護、改善排水。</li><li><b>「減少糧食損失與浪費」「廢棄物防治」屬減緩，不是調適</b>；「購買颱風洪水保險」屬調適；「不動產證券化」不是氣候機會（機會例：高效能供熱、低碳產品、綠色債券）。</li><li>IPCC AR6《2022 衝擊、調適與脆弱性》：八種代表性關鍵風險（沿海社會生態系統、陸海生態系統、糧食安全、水安全、生活水準與公平、和平與移民…）；<b>少子化不是</b>。沿海調適：改善排水、海堤與海岸養護、抬高沿海道路、鼓勵搬離；<b>「鼓勵節能減碳」屬減緩</b>。</li><li>調適選項：水安全＝灌溉基礎建設、生態截流／滯洪池、貧民區／水資源改造（<b>排水系統與建築規範不是</b>）；生活水準與公平＝以工代賑、微型貸款、農業保險（<b>海洋熱浪預警不是</b>）；和平與移民＝季節性就業與匯款、農村到城市移民。</li><li>臺灣「國家氣候變遷調適行動計畫（112–115 年）」7 大領域；土地利用由經濟部、農業部、內政部負責，<b>交通部不是</b>。</li></ul><h3>七、水、生物多樣性、汙染與土地</h3><ul><li><b>CDP 碳揭露計畫</b>：2020 年缺水導致經濟損失約 <b>3,000 億美元</b>；<b>UNESCO（2023）</b>：約 <b>25%</b> 人口無法取得安全飲用水。</li><li><b>WWF《地球生命力報告 2022》</b>：1970–2018 野生動物豐度減少 <b>69%</b>；<b>KBA 關鍵生物多樣性區</b>：臺北市野雁保護區。</li><li><b>Lancet Planetary Health</b>：疾病與過早死亡最主要因素＝<b>環境污染</b>；2015–2019 每年約 <b>900 萬人</b>死亡。</li><li><b>IPCC《氣候變遷與土地》</b>：2008–2017 土地吸收全球排放約 <b>30%</b>；2007–2016 農林土地利用占排放 <b>23%</b>；最大土地 CO₂ 來源＝<b>熱帶森林砍伐</b>；土地劣化影響人口 <b>1–3 億</b>。</li></ul><h3>八、風險資訊查詢</h3><ul><li>全球碳定價資料：<b>世界銀行</b>；臺灣斷層、土壤液化、淹水潛勢、3D 災害潛勢地圖：<b>國家災害防救科技中心</b>；海平面上升風險：<b>Climate Central</b>（升溫 3°C 恐淹沒約 <b>8 億</b>人居住地，含臺北龍山寺、白金漢宮、東京塔）；臺灣受淹水影響最顯著：<b>西南沿海</b>。</li><li>近年野火：加州、加拿大、印尼、澳洲皆是。</li></ul>", "33": "<h3>社會風險與金融機構的調適作為</h3><div style=\"overflow-x:auto\"><table style=\"border-collapse:collapse;font-size:.88em;width:100%\"><tr><th style=\"border:1px solid #f0dfe3;background:#fde8ee;padding:4px\">社會風險</th><th style=\"border:1px solid #f0dfe3;background:#fde8ee;padding:4px\">金融機構作為</th></tr><tr><td style=\"border:1px solid #f0dfe3;padding:4px\">貧窮</td><td style=\"border:1px solid #f0dfe3;padding:4px\"><b>微型保單</b>、公益彩券發行、慈善基金會（協助消除貧窮）</td></tr><tr><td style=\"border:1px solid #f0dfe3;padding:4px\">超高齡化</td><td style=\"border:1px solid #f0dfe3;padding:4px\"><b>安養信託、以房養老、即期年金險、目標到期基金</b>（高配息股票基金非適合）</td></tr><tr><td style=\"border:1px solid #f0dfe3;padding:4px\">少子化</td><td style=\"border:1px solid #f0dfe3;padding:4px\">凍卵險、育嬰留職停薪制度、生育保險</td></tr><tr><td style=\"border:1px solid #f0dfe3;padding:4px\">居住正義</td><td style=\"border:1px solid #f0dfe3;padding:4px\">青年安心成家貸款、延長貸款期限或寬限期</td></tr><tr><td style=\"border:1px solid #f0dfe3;padding:4px\">良好健康福祉</td><td style=\"border:1px solid #f0dfe3;padding:4px\"><b>外溢保單</b>（如戒菸外溢）；傳染病風險＝<b>防疫保單</b></td></tr><tr><td style=\"border:1px solid #f0dfe3;padding:4px\">城鄉差距</td><td style=\"border:1px solid #f0dfe3;padding:4px\"><b>金融科技</b>讓民眾方便使用金融服務</td></tr><tr><td style=\"border:1px solid #f0dfe3;padding:4px\">公共安全威脅</td><td style=\"border:1px solid #f0dfe3;padding:4px\">協助民眾轉帳免被詐騙</td></tr></table></div><div class=\"trap\">目標到期基金屬「適合高齡長者」商品；高配息股票基金波動大，不在答案內。外溢保單→健康福祉；金融科技→縮小城鄉差距；反詐騙→公共安全。</div>", "34": "<h3>治理風險</h3><ul><li>金融機構因應治理風險的作為：<b>董事會成員多元化、誠信經營、成立薪酬委員會、成立防制洗錢及打擊資恐委員會</b>；<b>與大學產學合作、增聘身心障礙員工、育嬰留職停薪制度</b>不屬治理風險作為（後兩者屬社會面向）。</li><li>被金管會裁罰的原因例：機房電力設備異常（營運）、行員與客戶異常資金往來、大股東干政；<b>「董事會成員都是男性」不是裁罰原因</b>。</li><li>檢驗金融機構永續作為的外部標準：<b>ISO 14064-1 溫室氣體盤查、赤道原則 Equator Principles、責任投資原則 PRI（Principles for Responsible Investment）、RE100</b>；<b>IFRS 17（保險合約會計準則）不適合</b>。</li></ul><div class=\"trap\">IFRS 17 是保險會計準則，與永續無關；產學合作、身障聘用屬社會面。</div>", "41": "<h3>一、臺灣發展永續金融商品的挑戰</h3><ul><li>溫室氣體盤查資訊尚不充足、各評比機構 ESG 評分差距大、金融業需要更細緻易取得的氣候及 ESG 資料、永續金融專業人才不足（<b>四項皆是</b>）。</li></ul><h3>二、ESG 評比</h3><ul><li>不同評比機構指標與評分<b>並不相同</b>；資料來源＝<b>公開資料、公司永續報告書、問卷調查</b>。</li><li>環境常見指標：廢棄物、氣候、溫室氣體、生物多樣性；社會：員工福利、勞動力管理、人才吸引與留任、產品責任；治理：商業道德、董事獨立性、股東政策、風險管理、反貪腐。</li><li><b>富時羅素 FTSE Russell</b>：環境、社會、治理 3 支柱，<b>風險管理屬治理</b>；消費者責任、勞工規範基準屬社會。</li><li><b>MSCI ESG</b>：3 大支柱，環境支柱 4 主題（氣候變遷、自然資本、污染與廢棄物、環境機會等），<b>產品責任屬社會</b>；評分流程＝蒐集公開原始數據→各支柱主題評分→整合關鍵議題分數→依產業調整相對分數。</li></ul><h3>三、國內評鑑</h3><ul><li><b>公司治理評鑑</b>：功能含編製公司治理指數依據、對表現不理想公司差異化監理、供投資人評估 ESG 表現（三者皆是）；依書中答案另含環境及社會指標。</li><li><b>永續金融評鑑</b>：111 年底首次發布；三支柱＝<b>環境、社會、公司治理</b>；環境＝氣候風險策略；治理＝利害關係維護；<b>特別扣分制度</b>針對重大監理缺失；目的<b>非</b>引導金融業捐助。</li></ul><h3>四、永續指數</h3><ul><li>社會主題指數例：MSCI 女性領導力、臺灣高薪 100、臺灣就業 99；<b>臺灣永續指數</b>較不是社會主題。</li><li>ESG 指數整合流程：<b>母指數→ESG 剔除標準→ESG 評級或主題篩選→權重設計→指數管理與維護</b>。</li></ul>", "42": "<h3>一、ESG 投資定義與商品</h3><ul><li>ESG 投資＝<b>管理資產</b>的方式之一，將環境、社會、治理因素納入<b>投資決策</b>。</li><li>債券、基金、ETF 皆可納入 ESG；衍生性商品也可；非僅機構投資人可買。</li><li>永續債券分綠色、社會、可持續發展、可持續發展連結；<b>臺灣發行檔數最多為綠色債券</b>。</li></ul><h3>二、永續投資方式</h3><ul><li><b>排他性篩選（負向表列）</b>：排除特定行業或公司；<b>產業別最佳（正向選股）</b>：選同業中 ESG 表現較佳者；<b>以標準為依據</b>：依國際標準篩選；<b>整合 ESG 因子</b>；<b>永續相關主題投資</b>：投資特定永續主題；<b>影響力與社區投資</b>：產生積極社會或環境影響並追求財務報酬；<b>企業參與及股東行動</b>：行使投票權、議合。</li><li><b>高股息主題投資</b>不是永續投資方式。</li><li><b>PRI 責任投資原則</b>隸屬聯合國。</li></ul><h3>三、盡職治理 Stewardship</h3><ul><li>守則主要規範<b>機構投資人</b>；起源於英國；我國<b>已訂定</b>；方式＝<b>投票、議合、出席股東會</b>，<b>取得經營權不是</b>。</li><li>應制訂盡職治理政策、利益衝突政策、投票政策三項；原則不含參與經營權及董監事選舉。</li></ul><h3>四、ESG 基金</h3><ul><li>ESG 基金與非 ESG 基金差別＝選股策略<b>加入 ESG 元素</b>；不保證報酬優於非 ESG 基金。</li><li>ESG 主題基金監理：定期揭露資訊、說明永續投資策略與方法、ESG 相關投資配置至少<b>六成</b>；<b>無年報酬率不得低於 5%</b>；不要求全數資金用於永續投資；績效指標應與投資重點一致。</li><li>ESG ETF 採<b>被動式投資</b>。</li><li>國內推動綠色金融：綠色信用卡、綠色股票及債券指數、綠色保險；<b>減少議合不是</b>推動方向。</li></ul>", "43": "<h3>一、國際準則與機構</h3><ul><li><b>ICMA 國際資本市場協會</b>：綠色債券原則 GBP、社會責任債券原則等（限定資金用途債券原則須揭露專案評估與選擇流程）。</li><li><b>CBI 氣候債券倡議組織</b>：氣候債券分類標準（能源、水資源、土地利用與海洋資源等，<b>文創不是</b>）；驗證含發行前、發行後；《可信轉型融資白皮書》：1.5℃ 路徑、科學依據、技術可行與實際行動，<b>不以碳抵換為主要減碳成果</b>。</li><li><b>歐盟綠色債券標準 EUGBS</b>：用途須與永續分類規則一致、綠色債券架構、資金分配與影響報告、獨立第三方外部驗證。</li><li><b>PRI</b> 不是債券監理準則或機構。</li></ul><h3>二、轉型金融</h3><ul><li>符合：具體時程與年度 KPI、第三方查核、中期目標符合 SBTi；不符合：僅靠購買碳權、無具體計畫與時程。</li></ul><h3>三、永續發展債券 GSSS 與種類</h3><div style=\"overflow-x:auto\"><table style=\"border-collapse:collapse;font-size:.88em;width:100%\"><tr><th style=\"border:1px solid #f0dfe3;background:#fde8ee;padding:4px\">種類</th><th style=\"border:1px solid #f0dfe3;background:#fde8ee;padding:4px\">資金用途</th><th style=\"border:1px solid #f0dfe3;background:#fde8ee;padding:4px\">備註</th></tr><tr><td style=\"border:1px solid #f0dfe3;padding:4px\">綠色債券 Green</td><td style=\"border:1px solid #f0dfe3;padding:4px\">資金<b>全部</b>用於綠色投資計畫之放款</td><td style=\"border:1px solid #f0dfe3;padding:4px\">限定用途 UOP</td></tr><tr><td style=\"border:1px solid #f0dfe3;padding:4px\">社會責任債券 Social</td><td style=\"border:1px solid #f0dfe3;padding:4px\">資金用於社會效益投資計畫（如可負擔住宅、基礎設施、糧食安全、青年住宅）</td><td style=\"border:1px solid #f0dfe3;padding:4px\">限定用途 UOP</td></tr><tr><td style=\"border:1px solid #f0dfe3;padding:4px\">可持續發展債券 Sustainability</td><td style=\"border:1px solid #f0dfe3;padding:4px\">資金<b>全部同時</b>用於綠色與社會效益計畫</td><td style=\"border:1px solid #f0dfe3;padding:4px\">限定用途 UOP</td></tr><tr><td style=\"border:1px solid #f0dfe3;padding:4px\">可持續發展連結債券 SLB</td><td style=\"border:1px solid #f0dfe3;padding:4px\"><b>用途不受限</b>，本息支付條件與 SPT 連結；需 KPI、SPT</td><td style=\"border:1px solid #f0dfe3;padding:4px\">非 UOP</td></tr></table></div><ul><li><b>綠色、社會責任、可持續發展債券屬永續發展專項資金債券</b>；GSSS 不含公司治理；<b>綠色投資計畫不含化石燃料發電</b>；<b>污染防治與控制屬綠色，不屬社會</b>。</li><li>SLB 常見連結指標：生物多樣性、用水量、範疇一；範疇三非常見（依書中答案）。</li></ul>", "44": "<h3>一、永續授信種類</h3><div style=\"overflow-x:auto\"><table style=\"border-collapse:collapse;font-size:.88em;width:100%\"><tr><th style=\"border:1px solid #f0dfe3;background:#fde8ee;padding:4px\">種類</th><th style=\"border:1px solid #f0dfe3;background:#fde8ee;padding:4px\">資金／特色</th><th style=\"border:1px solid #f0dfe3;background:#fde8ee;padding:4px\">授信類型</th></tr><tr><td style=\"border:1px solid #f0dfe3;padding:4px\">綠色貸款／授信</td><td style=\"border:1px solid #f0dfe3;padding:4px\">資金<b>全部</b>用於環境保護或氣候相關支出</td><td style=\"border:1px solid #f0dfe3;padding:4px\">綠色授信</td></tr><tr><td style=\"border:1px solid #f0dfe3;padding:4px\">社會貸款／授信</td><td style=\"border:1px solid #f0dfe3;padding:4px\">資金<b>全部</b>用於社會關懷、能發揮社會影響力之專案（如身障者職能培訓）</td><td style=\"border:1px solid #f0dfe3;padding:4px\">社會授信</td></tr><tr><td style=\"border:1px solid #f0dfe3;padding:4px\">永續貸款／授信</td><td style=\"border:1px solid #f0dfe3;padding:4px\">資金<b>全部同時</b>用於環境及社會影響力專案</td><td style=\"border:1px solid #f0dfe3;padding:4px\">永續授信</td></tr><tr><td style=\"border:1px solid #f0dfe3;padding:4px\">永續連結貸款 SLL</td><td style=\"border:1px solid #f0dfe3;padding:4px\"><b>用途不限</b>，須設定 SPT 與 KPI；貸款利率與永續績效連結，達標可享優惠</td><td style=\"border:1px solid #f0dfe3;padding:4px\">永續連結授信</td></tr></table></div><ul><li>銀行因應淨零：對永續建設專案提供優惠利率、碳排納入授信審核、開發永續目標連結貸款；<b>提升短天期貸款額度不是</b>。</li><li>SLL 優點：資金運用比綠色貸款彈性、利率連結 ESG 績效、可追蹤實質改善；<b>不是</b>向政府請領津貼。SPT 須<b>放款前</b>設定。</li></ul><h3>二、國際倡議</h3><ul><li><b>赤道原則 Equator Principles</b>：金融機構的<b>自願性</b>行為規範，評估專案融資的<b>環境與社會風險</b>，分 A（高風險）、B（中）、C（低）三級；過渡性融資含在四大類案件中；銀行可用合約規範與放款後持續監控。</li><li><b>責任銀行原則 PRB</b>：聯合國環境規劃署推動；履行步驟＝影響分析、目標制定與實施（簽署後 12 個月內）、定期揭露；六大框架＝一致性、衝擊與目標設定、客戶、利害關係人（主動）、治理與文化、透明度及當責；目標所依循標準<b>不應低於</b> SDGs、巴黎協定。</li><li><b>永續貸款原則</b>：綠色、社會責任、永續連結貸款原則皆由 LMA、APLMA、LSTA 合作制定，<b>非強制</b>。</li></ul><h3>三、其他綠色金融商品</h3><ul><li>綠色信用卡：促進環保與永續；綠色存款：銀行承諾資金投入綠色投資專案；綠色消費貸款：明確資金用途、鼓勵環保行為、可搭配補助或利率優惠。</li><li>綠色授信範圍：再生能源發電、回收紙製程能源優化、零燃煤汽電共生等；<b>建置捷運與汽車專用高架橋不屬於</b>；石化業若未減碳轉型最可能被剔除。</li></ul>", "45": "<h3>一、永續保險原則 PSI（Principles for Sustainable Insurance）</h3><ul><li>隸屬聯合國環境規劃署體系；原則一＝將保險業相關 ESG 議題融入公司決策（面向：商品與服務、風險管理與核保、理賠管理；<b>客戶與供應商不是</b>）；原則二＝與客戶及業務夥伴合作；原則三＝與政府、監管機構及利害關係人合作；原則四＝透明揭露、定期揭露。</li><li>施行 <b>PRI</b> 責任投資原則即滿足 PSI 原則一。PRI、PSI、PRB、赤道原則<b>皆非強制性</b>，且皆要求揭露實施狀況。保險業責任投資＝投資於再生能源與基礎建設。</li></ul><h3>二、綠色保險四大類（產險公會）</h3><div style=\"overflow-x:auto\"><table style=\"border-collapse:collapse;font-size:.88em;width:100%\"><tr><th style=\"border:1px solid #f0dfe3;background:#fde8ee;padding:4px\">類別</th><th style=\"border:1px solid #f0dfe3;background:#fde8ee;padding:4px\">例子</th></tr><tr><td style=\"border:1px solid #f0dfe3;padding:4px\">積極性節能減碳保險</td><td style=\"border:1px solid #f0dfe3;padding:4px\">節能、能源效率、綠建築等</td></tr><tr><td style=\"border:1px solid #f0dfe3;padding:4px\">消極性風險移轉保險</td><td style=\"border:1px solid #f0dfe3;padding:4px\">既有風險因氣候改變而擴大，如<b>農業保險</b></td></tr><tr><td style=\"border:1px solid #f0dfe3;padding:4px\">再生能源產業保險</td><td style=\"border:1px solid #f0dfe3;padding:4px\">如<b>離岸風電保險</b>，承保建造安裝與營運時損失</td></tr><tr><td style=\"border:1px solid #f0dfe3;padding:4px\">創新服務與流程</td><td style=\"border:1px solid #f0dfe3;padding:4px\">如 UBI 汽車保險（可兼屬節能減碳）</td></tr></table></div><ul><li>具綠色性質或元素的保險商品皆可稱綠色保險；主要目的＝提高環境治理與監管水準。</li></ul><h3>三、各類綠色保險</h3><ul><li><b>節能保險 ESI</b>：僅承保節能表現未達約定目標時之補償；ESCO 提供技術、<b>非被保險人</b>；<b>需第三方驗證機構</b>。<b>能源效率保險 EEI</b>：承保設施損壞、營業中斷、資產節能表現；利害關係人含企業、ESCO、金融機構，<b>不含政府</b>。</li><li><b>綠建築保險</b>三型：重置成本保障型（損失時補貼、促升級）、營業中斷保障型、相關費用保障型；臺灣常以住家綠能升級附加條款呈現。</li><li><b>綠色汽車保險／UBI</b>：以里程計費，並優惠碳排低、油電混合車。</li><li><b>氣候保險</b>：保障極端氣候損失，常由公私部門共建；<b>參數型天氣保險</b>：以降水量等天氣參數理賠，條件客觀、理賠快、<b>無須訪查損失</b>、不需達一定損失（如番石榴農作物保險）；<b>環境污染責任保險</b>：轉嫁污染風險；<b>共享經濟保險</b>：減碳、運用閒置資源；<b>參數型生物多樣性保險</b>：以生態指標觸發、專用於生態修復。</li><li><b>外溢保單</b>：依健康行為（步數、體檢）給予保費折扣。</li></ul>", "46": "<h3>金融機構防漂綠參考指引</h3><ul><li><b>漂綠 Greenwashing</b>：宣稱綠色、永續但實際名實不符，如聲明誇大、缺乏證據、訊息模糊、隱藏負面資訊。</li><li>指引目的：提醒注意漂綠行為、避免金融商品與服務<b>名實未符</b>、避免資訊不對稱；<b>不是加強永續金融商品行銷</b>。</li><li>原則：<b>正確性、完整性、可比較性</b>；真實正確且有證據支持、直接易於理解、不遺漏重要訊息、<b>定期審視</b>正確性、提供公平比較基準、清楚說明限制、使用具體指標。</li><li>易違反：綠色放款對象減碳採<b>碳抵換卻未公開說明</b>；基金銷售網頁將永續商品與一般商品混在一起；使用模糊字樣。</li></ul>"};

renderCd();
(function(){const h=document.querySelector('header'),p=document.createElement('div');p.id='cdSet';p.hidden=true;
p.innerHTML='<span>📅 考試日</span><input type="date" id="cdIn"><button class="btn" id="cdOk">儲存</button><button class="btn" id="cdNo">取消</button>';h.appendChild(p);
const iso=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
$('cd').onclick=()=>{p.hidden=!p.hidden;$('cdIn').value=iso(examDate())};
$('cdNo').onclick=()=>{p.hidden=true};
$('cdOk').onclick=()=>{const v=$('cdIn').value;if(!v)return;LS.set(EXAM_KEY,v);renderCd();p.hidden=true}})();
// tabs
document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('on',x==b));document.querySelectorAll('.pane').forEach(p=>p.classList.toggle('on',p.id==b.dataset.p));if(b.dataset.p=='wrong')renderWrong();if(b.dataset.p=='quiz')syncStars()});
// plan
const PLAN=[['09/26(六)','1-1 永續介紹與發展目標'],['09/27(日)','1-2 國內永續發展政策'],['09/28(一)','1-3 國際永續發展政策'],['09/29~10/04','2-1 國際永續資訊公開規範'],['10/05(一)','2-3 第三方確信'],['10/06(二)','3-1 整體ESG風險概述'],['10/07(三)','3-2 環境風險'],['10/08(四)','3-3 社會風險、3-4 治理風險'],['10/09(五)','第三章總複習、<br>4-1~4-3 評比、投資、融資'],['10/10(六)','4-4~4-6 授信、保險、漂綠問題<br>第四章總複習'],['10/11(日)','2-2 國內永續資訊公開規範、<br>第二章總複習'],['10/12(一)','總複習'],['10/13(二)','總複習'],['10/14(三)','考前衝刺'],['10/15(四)','考前衝刺'],['10/16(五)','模擬考💪'],['10/17(六)','🎯 考試當天 2:00~3:30 💯']];
const PK='plan_items_v1';
let PI=LS.get(PK,null);
if(!Array.isArray(PI)){PI=PLAN.map(p=>({d:p[0],t:p[1].replace(/<br>/g,'\n'),x:false}));LS.set(PK,PI)}
let editing=false;
const esc=v=>String(v).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const savePlan=()=>LS.set(PK,PI);
const grow=t=>{t.style.height='auto';t.style.height=t.scrollHeight+2+'px'};
function armed(btn,label,fn){if(btn.dataset.arm){fn();return}const old=btn.textContent;btn.dataset.arm=1;btn.textContent=label;setTimeout(()=>{if(btn.isConnected){delete btn.dataset.arm;btn.textContent=old}},2500)}
function renderPlan(){const box=$('planBox');
if(!editing){
box.innerHTML='<div class="pl-tool"><button class="btn" id="pEdit">✏️ 編輯計畫</button></div>'+(PI.length?PI.map((p,i)=>`<label class="plan ${p.x?'done':''}"><input type="checkbox" data-i="${i}" ${p.x?'checked':''}><b>${esc(p.d)}</b><span>${esc(p.t).replace(/\n/g,'<br>')}</span></label>`).join(''):'<p class="small">還沒有計畫，按「編輯計畫」新增吧！</p>');
box.querySelectorAll('input[type=checkbox]').forEach(c=>c.onchange=()=>{PI[c.dataset.i].x=c.checked;savePlan();renderPlan()});
$('pEdit').onclick=()=>{editing=true;renderPlan()};
}else{
box.innerHTML='<div class="pl-tool"><button class="btn" id="pDone">✅ 完成</button><button class="btn" id="pAdd">＋ 新增一列</button></div>'+PI.map((p,i)=>`<div class="pl-edit" data-i="${i}"><div class="pl-row"><input class="pe-d" value="${esc(p.d)}" placeholder="日期，例如 10/18(日)"><button class="mini" data-a="up">↑</button><button class="mini" data-a="dn">↓</button><button class="mini" data-a="del">✕</button></div><textarea class="pe-t" rows="1" placeholder="內容（按 Enter 可換行）">${esc(p.t)}</textarea></div>`).join('')+'<div class="pl-tool"><button class="btn" id="pReset">↩︎ 還原預設計畫</button></div><p class="small">✕ 要點兩下才會刪除；修改會自動儲存。</p>';
box.querySelectorAll('.pl-edit').forEach(r=>{const i=+r.dataset.i;
r.querySelector('.pe-d').oninput=e=>{PI[i].d=e.target.value;savePlan()};
const t=r.querySelector('.pe-t');t.oninput=e=>{PI[i].t=e.target.value;savePlan();grow(t)};grow(t);
r.querySelectorAll('.mini').forEach(m=>m.onclick=()=>{const a=m.dataset.a;
if(a=='del')armed(m,'確定?',()=>{PI.splice(i,1);savePlan();renderPlan()});
else{const j=a=='up'?i-1:i+1;if(j<0||j>=PI.length)return;[PI[i],PI[j]]=[PI[j],PI[i]];savePlan();renderPlan()}})});
$('pAdd').onclick=()=>{PI.push({d:'',t:'',x:false});savePlan();renderPlan();const ds=box.querySelectorAll('.pe-d');const l=ds[ds.length-1];l.focus();l.scrollIntoView({block:'center'})};
$('pDone').onclick=()=>{PI=PI.filter(p=>p.d.trim()||p.t.trim());savePlan();editing=false;renderPlan()};
$('pReset').onclick=e=>armed(e.target,'確定還原?',()=>{PI=PLAN.map(p=>({d:p[0],t:p[1].replace(/<br>/g,'\n'),x:false}));savePlan();renderPlan()});
}}
renderPlan();
// notes
$('noteSel').innerHTML=Object.keys(SEC).map(k=>`<option value="${k}">${SEC[k]}</option>`).join('');
function renderNote(){const k=$('noteSel').value;$('noteBox').innerHTML=`<h2 style="margin:0;font-size:1.1em">${SEC[k]}　<span class="small">題庫 ${cnt(k)} 題</span></h2>`+(NOTES[k]||'<p>筆記建置中</p>')}
$('noteSel').onchange=renderNote;renderNote();
// quiz
const KEYIDS=new Set(["12021", "12023", "12024", "12031", "12052", "12057", "12058", "12059", "12060", "12061", "12062", "12063", "12064", "12065", "12066", "12067", "12068", "13005", "13036", "13037", "13038", "13039", "13040", "13041", "13042", "13043", "13046", "13048", "13049", "13059", "13062", "21009", "21029", "21030", "21031", "21032", "21033", "21034", "21035", "21036", "21037", "21038", "21039", "21040", "21042", "21045", "21055", "21056", "21065", "21066", "21068", "21070", "21081", "21107", "22001", "22002", "22003", "22004", "22005", "22006", "22007", "22008", "22009", "22010", "22011", "22012", "22013", "22014", "22015", "22016", "22017", "22018", "22019", "22021", "22028", "22029", "22030", "22032", "22035", "22039", "22041", "22046", "22064", "22072", "22073", "22078", "22098", "32023", "32033", "32080", "34004", "34005", "42021", "43004", "43008", "43009"]);
const CH=[['1','第一章 永續基本概念 (50)',['11','12','13']],['2','第二章 永續資訊揭露 (50)',['21','22','23']],['3','第三章 永續風險管理與治理 (50)',['31','32','33','34']],['4','第四章 永續金融 (50)',['41','42','43','44','45','46']]];
$('scope').innerHTML=CH.map(c=>`<option value="${c[0]}">${c[1]}</option>`+c[2].map(s=>`<option value="${s}">　${SEC[s]} (${cnt(s)})</option>`).join('')).join('')+'<option value="ALL">🏁 總複習：第一～四章 (80)</option><option value="KEY">🔥 115重點題・五大主題精選 ('+KEYIDS.size+')</option><option value="R3">📚 115年第3次 歷屆試題 (6/6) (80)</option><option value="R4">📚 115年第4次 歷屆試題 (8/2) (80)</option>';
const SK='quiz_sessions_v1',LK='quiz_last_v1';
let SS=LS.get(SK,null);
if(!SS||typeof SS!='object'){SS={};const o=LS.get('quiz_state_v9',null);if(o&&o.scope&&o.ids){SS[o.scope]=o;LS.set(LK,o.scope)}LS.set(SK,SS)}
const getSess=sc=>{const x=LS.get(SK,{})[sc];return x&&x.ids&&x.ids.every(id=>BY[id])&&(sc!='ALL'||x.v==2)?x:null};
let S=getSess(LS.get(LK,null));
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a};
const inScope=sc=>(sc=='ALL'?DB:sc=='KEY'?DB.filter(q=>KEYIDS.has(q.id)):sc[0]=='R'?EX.filter(q=>q.id.startsWith(sc)):DB.filter(q=>q.id.startsWith(sc))).map(q=>q.id).sort();
const MOCKQ={"11": 5, "12": 8, "13": 10, "21": 14, "22": 8, "23": 1, "31": 1, "32": 10, "33": 1, "34": 1, "41": 3, "42": 4, "43": 2, "44": 7, "45": 2, "46": 3};
const TOPICS=[[/IFRS|ISSB|永續揭露準則/i,1.2],[/轉型金融|轉型計畫|轉型原則|轉型活動|Transition|綠色及轉型金融|永續經濟活動|認定指引|DNSH|無重大危害|最低限度|最小社會保障|分類標準|Taxonomy/i,1.6]];
const topicW=q=>{const t=q.q+' '+q.o.join(' ');let w=1;TOPICS.forEach(x=>{if(x[0].test(t))w=Math.max(w,x[1])});return w};
function mockPick(){let ids=[];for(const sec in MOCKQ){const c=DB.filter(q=>q.id.startsWith(sec));ids=ids.concat(c.map(q=>({id:q.id,k:Math.pow(Math.random(),1/topicW(q))})).sort((a,b)=>b.k-a.k).slice(0,Math.min(MOCKQ[sec],c.length)).map(x=>x.id))}return ids.sort()}
function load(sc,random){const all=inScope(sc);const ch=sc.length==1||sc=='ALL';let ids;
if(sc[0]=='R'||sc=='KEY')ids=random?shuffle(all):all;else if(sc=='ALL')ids=mockPick();else if(ch)ids=shuffle(all).slice(0,50).sort();else if(random)ids=shuffle(all).slice(0,35);else ids=all;
S={scope:sc,random:!!random,review:ch,ids:ids,ans:{}};if(sc=='ALL')S.v=2;save();renderQuiz()}
const save=()=>{const ss=LS.get(SK,{});ss[S.scope]=S;LS.set(SK,ss);LS.set(LK,S.scope)};
function wrongAdd(id){const w=LS.get('wrong_v1',[]);if(!w.includes(id)){w.push(id);LS.set('wrong_v1',w)}}
function expHTML(q){if(q.id[0]=='R'){const e=q.m&&EXP[q.m];return `<div class="exp">💡 <b>考點解析</b><br>${e?e+`<br><span class="small">（對應題庫 [${q.m}]）</span>`:(q.m?`本題與題庫 [${q.m}] 相同，請對照該節筆記。`:'本題不在目前題庫中，請以官方答案為準，並對照相關章節筆記。')}</div>`}return `<div class="exp">💡 <b>考點解析</b><br>${EXP[q.id]||`本題屬「${SEC[q.id.slice(0,2)]}」，請對照【重點筆記】該節「陷阱」與相關段落複習。`}</div>`}
function syncStars(){const w=LS.get('wrong_v1',[]);document.querySelectorAll('#qBox .star').forEach(b=>{const on=w.includes(b.dataset.star);b.classList.toggle('on',on);b.textContent=on?'★':'☆'})}
const starBtn=id=>{const on=LS.get('wrong_v1',[]).includes(id);return `<button class="star ${on?'on':''}" data-star="${id}" title="不熟：清掉本題答案重做，並加入錯題本">${on?'★':'☆'}</button>`};
function qHTML(q,n,chosen,lock){const done=chosen!=null&&chosen!==undefined;const ok=done&&chosen==q.a;
return `<div class="card q ${done?(ok?'ok':'no'):''}">${n==='-'?'':starBtn(q.id)}<div class="qid">[${q.id}] 第 ${n} 題 ${done?(ok?'✅':'❌'):''}</div><div class="qt">${q.q}</div>`+q.o.map((o,i)=>{let c='opt';if(done){c+=' lock';if(i==q.a)c+=' right';else if(i==chosen)c+=' wrong'}const L='ABCD'[i];return `<button class="${c}" data-q="${q.id}" data-i="${i}">(${L}) ${o}${done&&i==q.a?' ✔️':''}${done&&i==chosen&&i!=q.a?' ❌':''}</button>`}).join('')+(done?expHTML(q):'')+'</div>'}
function updStat(){if(!S)return;let c=0,w=0;S.ids.forEach(id=>{if(S.ans[id]!=null){if(S.ans[id]==BY[id].a)c++;else w++}});const u=S.ids.length-c-w;$('score').textContent=`✅ 答對 ${c} 題｜❌ 答錯 ${w} 題｜⬜ 未作答 ${u} 題`;if(S.scope[0]=='R'){const n=S.scope=='R3'?'第3次 (6/6)':'第4次 (8/2)';$('stat').textContent=`📍 歷屆試題・115年${n}${S.random?'・隨機排序':''} (共 ${S.ids.length} 題)｜目前 ${(c*1.25).toFixed(2)} 分（70 分合格）`}else $('stat').textContent=S.scope=='KEY'?`📍 目前模式：115 重點題・五大主題精選 (共 ${S.ids.length} 題)`:S.review?(S.scope=='ALL'?`📍 目前模式：總複習（第一～四章）・隨機抽題 (共 ${S.ids.length} 題)`:`📍 目前模式：章節總複習・隨機抽題 (共 ${S.ids.length} 題)`):S.random?`📍 目前模式：隨機抽題測驗 (共 ${S.ids.length} 題)`:`📍 目前模式：全部題庫循序測驗 (共 ${S.ids.length} 題)`;}
function renderQuiz(){if(!S)return;$('scope').value=S.scope;$('bRand').classList.toggle('glow',!!S.random);
updStat();
$('qBox').innerHTML=S.ids.map((id,i)=>qHTML(BY[id],i+1,S.ans[id])).join('');
renderQuizBind()}
function renderQuizBind(){document.querySelectorAll('#qBox .star').forEach(b=>b.onclick=()=>{const id=b.dataset.star;const w0=LS.get('wrong_v1',[]);if(w0.includes(id)&&S.ans[id]==null){LS.set('wrong_v1',w0.filter(x=>x!=id));syncStars();return}delete S.ans[id];wrongAdd(id);save();updStat();const n=S.ids.indexOf(id)+1;const y=window.scrollY;b.closest('.card').outerHTML=qHTML(BY[id],n,undefined);renderQuizBind();window.scrollTo(0,y)});document.querySelectorAll('#qBox .opt').forEach(b=>{if(b.classList.contains('lock'))return;b.onclick=()=>{const id=b.dataset.q;if(S.ans[id]!=null)return;const i=+b.dataset.i;S.ans[id]=i;if(i!=BY[id].a)wrongAdd(id);save();updStat();const n=S.ids.indexOf(id)+1;const y=window.scrollY;b.closest('.card').outerHTML=qHTML(BY[id],n,i);renderQuizBind();window.scrollTo(0,y)}})}
$('scope').onchange=()=>{const sc=$('scope').value,x=getSess(sc);if(x){S=x;LS.set(LK,sc);renderQuiz();window.scrollTo(0,0)}else load(sc,false)};
$('bRand').onclick=()=>load($('scope').value,true);
$('bRe').onclick=()=>{if(!S)return;S.ans={};save();renderQuiz();window.scrollTo(0,0)};
if(!S||!S.ids||S.ids.some(id=>!BY[id]))load('11',false);else renderQuiz();
// wrong book
function renderWrong(){const w=LS.get('wrong_v1',[]).sort();$('wBox').innerHTML=w.length?`<div class="status">共 ${w.length} 題錯題（請手動移除已熟悉的題目）</div>`+w.map(id=>{const h=qHTML(BY[id],'-',BY[id].a);return h.slice(0,-6)+`<button class="btn" data-rm="${id}" style="width:100%;margin-top:6px">✔ 我會了，移出錯題本</button></div>`}).join(''):'<div class="card">🎉 目前沒有錯題！</div>';
document.querySelectorAll('[data-rm]').forEach(b=>b.onclick=()=>{LS.set('wrong_v1',LS.get('wrong_v1',[]).filter(x=>x!=b.dataset.rm));renderWrong();syncStars()})}
$('bClr').onclick=()=>{if(confirm('確定清空錯題本？')){LS.set('wrong_v1',[]);renderWrong();syncStars()}};
</script></body></html>
