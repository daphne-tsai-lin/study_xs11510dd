<style>

*{box-sizing:border-box}html,body{margin:0}

.btn.glow{background:var(--pink);color:#fff;box-shadow:0 0 10px 3px #f4a6bdcc}
.status{font-size:.88em;background:var(--yel);border-radius:10px;padding:6px 10px;margin:6px 0}
.plan{display:flex;gap:8px;align-items:flex-start;padding:8px 0;border-bottom:1px dashed var(--line)}
.plan input{width:20px;height:20px;margin-top:3px;accent-color:var(--pink2);flex:none}
.plan.done span{text-decoration:line-through;color:#aaa}
.plan b{color:var(--pink2)}
.q{border-left:5px solid var(--pink);}
.q.ok{border-left-color:var(--ok)}.q.no{border-left-color:var(--bad)}
.card.q{position:relative}.star{position:absolute;top:6px;right:8px;border:none;background:transparent;font-size:1.6em;line-height:1;color:#cbbec3;cursor:pointer;padding:2px 6px}.star.on{color:#f5b301}.qid{font-size:.8em;color:#a08b95}.qt{font-weight:600;margin:2px 0 8px}
.opt{display:block;width:100%;text-align:left;padding:9px 10px;margin:5px 0;border:2px solid var(--line);background:#fffafb;border-radius:10px;font-size:.95em;color:var(--ink);cursor:pointer}
.opt.lock{cursor:default}
.opt.right{background:#dff5e9;border-color:var(--ok)}.opt.wrong{background:#fde2e6;border-color:var(--bad)}
.exp{margin-top:8px;background:var(--yel);border-radius:10px;padding:8px 10px;font-size:.9em}
.note h3{margin:14px 0 4px;color:var(--pink2);font-size:1.02em}.note ul{margin:4px 0;padding-left:20px}.note li{margin:3px 0}
.trap{background:#fde8ee;border-radius:8px;padding:6px 8px;margin:6px 0}.trap:before{content:"⚠️ 陷阱：";font-weight:700}
.small{font-size:.85em;color:#8c7a83}
</style><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Huninn&display=swap&text=%E6%B0%B8%E7%BA%8C%E7%99%BC%E5%B1%95-%E5%AD%B8%E7%BF%92%E7%AB%99" rel="stylesheet">

管技術標準(RTS)","企業永續報告指令(CSRD)","歐盟永續分類標準(EU Taxonomy Regulation)"],"a":2},{"id":"13060","q":"《企業永續報告指令》(CSRD)主要規定歐盟的哪些企業需根據歐洲永續性報告標準(ESRS)揭露其所面臨的社會和環境風險，以及企業活動對民眾和環境影響之報告？","o":["新創企業","中小型企業","未上市上櫃企業","上市公司及大型企業"],"a":3},{"id":"13061","q":"歐洲永續性報告標準(ESRS)是由以下哪個組織所制定，同時參考並促進國際標準化的倡議？","o":["歐洲財務報導諮詢小組(EFRAG)","歐盟執行委員會(European Commission)","歐盟理事會(Council of the EU)","歐洲監管機構(ESAs)"],"a":0},{"id":"13062","q":"《企業永續報告指令》(CSRD)是歐盟規定受規範的上市公司及大型企業，根據以下哪一個標準揭露其所面臨的社會和環境風險，以及企業活動對民眾和環境影響之報告？","o":["監管技術標準(RTS)","歐洲永續性報告標準(ESRS)","有關主要不利影響(PAIs)和金融產品揭露的 SFDR 委託法規審查","歐盟永續分類標準(EU Taxonomy Regulation)"],"a":1},{"id":"13063","q":"有關企業永續報告指令(CSRD)，歐盟秉持哪個原則，強調企業對於社會的「影響」與「財務」同樣重要？","o":["永續原則","資訊揭露原則","雙重重大性(Double Materiality)原則","循環再利用原則"],"a":2},{"id":"13064","q":"有關企業永續報告指令(CSRD)，歐盟秉持雙重重大性(Double Materiality)原則，強調企業對於社會的哪兩個方面同樣重要？","o":["環境與經濟","影響與財務","環境與財務","環境與影響"],"a":1},{"id":"13065","q":"有關企業永續報告指令(CSRD)的敘述，下列何者錯誤？","o":["評估因氣候變遷和其他永續性議題所帶來的財務風險和機會","透過提供報告資訊進行協調，以降低企業在中長期的報告成本","評估其他永續性議題所帶來的財務風險和機會","確保投資人和利益相關人能夠獲取評估大公司的財務資訊"],"a":3},{"id":"13066","q":"碳邊境調整機制(CBAM)自何時起過渡期結束，開始正式實施付費制的 CBAM？","o":["2023 年 10 月","2024 年 1 月","2026 年 1 月","2026 年 12 月"],"a":2},{"id":"13067","q":"有些企業因成本考量，不試圖從營運流程中減少碳排，而是將碳排放量從 A 國移到 B 國，或是從不積極從事減碳的地區進口替代品，如此會對全球的碳排放量(carbon emission)產生何種影響？","o":["會大幅減少全球的碳排放量","對全球的碳排放量完全沒有影響","不會減少全球的碳排放量","對全球在 2050 年達成淨零碳排的目標完全沒有影響"],"a":2},{"id":"13068","q":"歐盟的排放交易系統(EU ETS)採取下列何種管制交易，因此企業在設定的排放總量下，可以拿到一定比例的免費排放配額？","o":["限量管制交易","總量管制交易","完全無管制","部分限額管制交易"],"a":1},{"id":"13069","q":"歐盟的碳價除受政策干預外，係根據下列何者利用「污染者付費」的做法激勵企業從事減碳？","o":["碳排放量","碳抵消的排放量","碳洩漏的排放量","碳權憑證的供需"],"a":3},{"id":"13070","q":"根據歐盟的碳交易制度，只要生產地的碳定價低於歐盟排放交易系統(EU ETS)碳價的產品，一旦進口到歐盟關稅區，就要購買以下何者，補足兩者間的差額？","o":["碳排放額度","CBAM 憑證","碳抵消的排放量","碳洩漏的排放量"],"a":1},{"id":"13071","q":"歐盟永續簡化綜合套案(The Omnibus Simplification Package)對碳邊境調整機制(CBAM)調整內容，以下何者屬於被豁免義務的主要對象？","o":["所有大型跨國企業","中小企業(SMEs)及個人進口商","所有碳密集度高的企業","所有出口到歐盟的企業"],"a":1},{"id":"21001","q":"有關 GRI 正式推出的 GRI 永續報導準則（簡稱 GRI 準則），下列何者正確？","o":["僅適用於高碳排工業，如鋼鐵業與石化業等","僅適用於一次性非再生能源產業，如煤炭、石油、天然氣相關產業","僅適用於製造業","得適用於任何產業"],"a":3},{"id":"21002","q":"有關 GRI 準則的敘述，下列何者錯誤？","o":["是根基於永續發展的定義：「能滿足當代需求，同時不損及後代滿足其需求之發展」","強調其報導目的，在考量因為組織透過活動與商業關係，對於經濟、環境及人群產生影響","規定企業或組織須對永續發展所產生之負面衝擊進行分析和管理，但對正面貢獻並無相關要求","可使企業或組織定期向利害關係人揭露其永續資訊"],"a":2},{"id":"21003","q":"有關 GRI 準則的敘述，下列何者正確？","o":["設定了分配、門檻、目標、標的等評判好或壞的績效標竿","並無設定分配、門檻、目標、標的或任何評判好或壞的績效標竿","設定了評判好壞的績效標準，具備三大特色：指標一致性、產業特定指標與指標可比性","以四個組織運作的元素為核心：治理、策略、風險管理，以及指標和目標"],"a":1},{"id":"21004","q":"GRI 準則 2021 之系統架構於三個系列準則，分別為下列何者？","o":["GRI 環境準則、GRI 社會準則、GRI 治理準則","GRI 環境準則、GRI 社會準則、GRI 經濟準則","GRI 通用準則、GRI 進階準則、GRI 特殊準則","GRI 通用準則、GRI 行業準則、GRI 主題準則"],"a":3},{"id":"21005","q":"有關 GRI 準則 2021 當中的行業準則，下列敘述何者錯誤？","o":["組織根據其經營的行業類型使用行業準則","行業準則為組織提供其可能相關的重大主題資訊","組織在決定其重大主題和決定每個重大主題的報導內容時，使用適用於其行業的行業準則","GRI 準則 2021 發布的第一個針對特定行業的揭露準則是「金融業準則」"],"a":3},{"id":"21006","q":"有關 GRI 通用準則 2021 當中的 GRI 1，下列敘述何者正確？","o":["規定了關於報導組織的揭露項目","規定了使用 GRI 準則的要求和原則","規定了環境面(E)、社會面(S)、治理面(G)相關的資訊揭露項目要求","規定了環境面(E)與社會面(S)相關的資訊揭露項目要求"],"a":1},{"id":"21007","q":"有關 GRI 通用準則 2021 當中的 GRI 3，下列敘述何者正確？","o":["規定了環境面、社會面、治理面相關的資訊揭露項目要求","同時包含組織用來報導有關決定重大主題的流程、重大主題列表、如何管理每個重大主題等資訊揭露項目","有關注公司員工和治理策略，但未包含利害關係人","有關注公司員工和利害關係人，但未包含治理策略"],"a":1},{"id":"21008","q":"有關 GRI 通用準則 2021 當中的 GRI 1、GRI 2、GRI 3，下列敘述何者正確？","o":["組織須將 GRI 1、GRI 2、GRI 3 三個準則皆應用於報導中","組織可從 GRI 1、GRI 2、GRI 3 三個準則中任選兩個應用於報導中","組織可選擇以 GRI 1 搭配 GRI 2 應用於報導中，或以 GRI 1 搭配 GRI 3 應用於報導中","組織可選擇以 GRI 1 搭配 GRI 3 應用於報導中，或以 GRI 2 搭配 GRI 3 應用於報導中"],"a":0},{"id":"21009","q":"有關 GRI 通用準則 2021 當中的 GRI 2，下列敘述何者正確？","o":["有關注公司員工和治理策略，但未包含利害關係人","有關注公司員工和利害關係人，但未包含治理策略","有將「人權評估」與「盡職調查」兩者皆納入一般揭露指標中","有納入「人權評估」，但尚未將「盡職調查」納入一般揭露指標中"],"a":2},{"id":"21010","q":"有關 GRI 準則中與重大議題相關的敘述，下列何者正確？","o":["所有組織皆須決定其重大主題","僅有營收超過特定金額的企業或員工數量超過一定數量的組織須決定其重大主題","僅有企業須決定其重大主題","僅有高碳排產業須決定其重大主題"],"a":0},{"id":"21011","q":"有關 GRI 準則中與重大議題相關的敘述，下列何者正確？","o":["所有行業須報導的重大議題數量都相同","所有行業皆須報導至少 10 項重大主題","同一行業別的所有組織須報導的重大議題數量都相同","行業準則為組織提供其可能相關的重大主題資訊"],"a":3},{"id":"21012","q":"有關組織依循 GRI 準則決定重大主題的流程，下列敘述何者錯誤？","o":["組織需要使用適用的 GRI 行業準則以了解行業脈絡，並考量行業準則中描述的主題與衝擊","組織須定期鑑別實際和潛在衝擊，並評估衝擊顯著性","組織可透過與專家議合，以鑑別和評估衝擊顯著性","組織排定其最顯著衝擊的報導優先順序時，不得受到外部利害關係人影響"],"a":3},{"id":"21013","q":"有關組織依循 GRI 準則決定重大主題的流程，下列敘述何者錯誤？","o":["在每個報導期間，組織宜重新檢視其上一個報導期間的重大主題，以解釋衝擊的變化","衝擊的變化可能源於組織活動的變化","衝擊的變化不可能源於組織商業關係的變化","重新檢視有助於確保重大主題能代表組織在每個新的報導期間內最顯著的衝擊"],"a":2},{"id":"21014","q":"有關組織依循 GRI 準則決定重大主題的流程，下列敘述何者正確？","o":["每個步驟的方法將根據組織的特定情況而有所不同","同一國家中所有組織的每個步驟的方法都相同","同樣行業別中所有組織的每個步驟的方法都相同","所有組織的每個步驟的方法都相同"],"a":0},{"id":"21015","q":"有關組織依循 GRI 準則決定重大主題的流程之步驟，下列敘述何者錯誤？","o":["應每三個報導期間更換一次","應可複製","應有文件記錄","應具系統性"],"a":0},{"id":"21016","q":"有關 GRI 準則中對於決定重大主題時，組織鑑別衝擊的相關敘述，下列何者正確？","o":["僅須考量對經濟和環境的衝擊","僅須考量對環境和人群（包括其人權）的衝擊","僅須考量實際已經發生的衝擊","衝擊可以是實際已經發生的，或者潛在還未發生的"],"a":3},{"id":"21017","q":"有關 GRI 準則中對於決定重大主題時，組織鑑別衝擊的相關敘述，下列何者正確？","o":["衝擊不可能是正面、蓄意的","衝擊可能是負面、非蓄意的","衝擊都是短期的","衝擊都是不可逆的"],"a":1},{"id":"21018","q":"有關 GRI 準則中對於決定重大主題時，組織鑑別正面衝擊的相關敘述，下列何者正確？","o":["僅需考量實際發生的","僅需考量潛在還未發生的","可能是不可逆的","不可能是可逆的"],"a":2},{"id":"21019","q":"有關 GRI 準則中對於決定重大主題時，組織鑑別衝擊的相關敘述，下列何者正確？","o":["可以使用第三方評估所得的資訊","不可以使用第三方評估所得的資訊","不可以使用自己評估所得的資訊","只可以使用自己評估所得的資訊"],"a":0},{"id":"21020","q":"有關 GRI 準則中對於決定重大主題時，組織為了鑑別衝擊而使用的資訊來源，下列何者錯誤？","o":["來自法律審查、反貪腐法遵管理系統的資訊","財務稽核文件的資訊","職業安全衛生檢查文件的資訊","組織內部成員的個人資訊"],"a":3},{"id":"21021","q":"有關 GRI 準則中對於決定重大主題時，組織為了鑑別衝擊而使用的資訊來源，下列何者錯誤？","o":["可以透過組織自己建立的申訴機制來蒐集","組織同時也可以使用來自更廣泛的企業風險管理系統的資訊","更廣泛的企業風險管理系統專門鑑別組織本身的風險，不包含對組織外部經濟、環境和人群的衝擊","組織可以使用的外部資訊來源包括新聞機構和公民社會組織"],"a":2},{"id":"21022","q":"當組織依循 GRI 準則，在決定重大主題流程中鑑別衝擊時，因資源有限而遇到困難，宜採取下列何種作為？","o":["放棄鑑別正面衝擊","優先鑑別正面衝擊","優先鑑別負面衝擊","放棄鑑別負面衝擊"],"a":2},{"id":"21023","q":"有關組織鑑別衝擊的過程，下列敘述何者錯誤？","o":["在某些情況下，組織可能無法鑑別其所有活動和商業關係的負面衝擊","組織無法完整鑑別負面衝擊的原因可能是因為其價值鏈包含許多實體","組織無法完整鑑別負面衝擊原因可能是因為擁有多個全球業務","組織無法鑑別的負面衝擊都是潛在的衝擊"],"a":3},{"id":"21024","q":"下列何者是正面衝擊的例子？","o":["企業在原住民社區發展再生能源，為了取得土地使用，只要跟當地里長承諾提供金錢補助當地居民即可，是雙贏局面，即使部分居民不同意","組織採取措施降低客戶的再生能源成本，因此使更多客戶從使用非再生能源轉向再生能源，有助於減緩氣候變遷","組織研發出低耗能的設備，受到客戶喜愛，但原物料的取得卻必須仰賴更長距離的運輸","組織於偏遠社區建造高碳排的工廠，但因為創造當地居民就業機會，而獲得肯定"],"a":1},{"id":"21025","q":"組織依循 GRI 進行報導時，應報導所有 GRI 2 中的揭露項目，下列相關敘述何者正確？","o":["GRI 2 中的所有揭露項目都不可以有省略理由","「揭露項目 2-4 資訊重編」不可以有省略理由","「揭露項目 2-5 外部保證/確信」可以有省略理由","GRI 2 中的所有揭露項目都可以有省略理由，沒有例外"],"a":1},{"id":"21026","q":"有關組織依循 GRI 進行報導的敘述，下列敘述何者正確？","o":["如果組織未能符合依循 GRI 準則報導的所有要求，仍可以參考 GRI 準則進行報導","如果組織未能符合依循 GRI 準則報導的所有要求，就不可以參考 GRI 準則進行報導","如果組織未能符合依循 GRI 準則報導的所有要求，仍可以聲明已完整依循 GRI 準則","如果組織未能符合依循 GRI 準則報導的所有要求，只要符合九成以上的要求，就可以聲明依循 GRI 準則"],"a":0},{"id":"21027","q":"有關組織依循 GRI 進行報導的敘述，下列敘述何者正確？","o":["組織不可以為滿足特定的目的而使用選定的 GRI 準則或部分內容來報導有關特定主題的資訊","如果組織未能符合依循 GRI 準則報導的所有要求，則不可以參考 GRI 準則進行報導","組織不需要完全符合「參考 GRI 準則進行報導」此章節中的 3 項要求，包含發布 GRI 內容索引表、提供使用聲明、通報 GRI 等，也能參考 GRI 準則進行報導","組織為滿足特定的目的而使用選定的 GRI 準則或部分內容來報導有關特定主題的資訊，仍可以說明是參考 GRI 準則進行報導"],"a":3},{"id":"21028","q":"下列何者不屬於 GRI 允許的省略理由之一？","o":["不適用","無行業準則","法律禁令","保密規定限制"],"a":1},{"id":"21029","q":"以下何者最能說明新版 GRI 102 對企業的揭露新要求？","o":["僅需揭露前一年度的排放數據即可","應揭露氣候轉型與調適規劃、減量目標進度及社會影響","主要著重於再生能源技術的專利申請","僅限揭露範疇一與範疇二的排放量"],"a":1},{"id":"21030","q":"關於 GRI 102 與 IFRS S2 的關係，下列敘述何者正確？","o":["兩者揭露內容完全獨立，無重疊部分","企業依 GRI 揭露即可自動符合所有 IFRS 要求","GRI 102 將 IFRS S2 中溫室氣體排放範疇一至三的排放揭露視為等效，可避免重複報告","IFRS S2 僅適用於能源揭露，不涉及排放資訊"],"a":2},{"id":"21031","q":"下列哪一個永續資訊框架，參考了 TCFD 的框架，也參考了 SASB 的特定行業指引，讓企業能有更明確的指引將永續相關風險與機會呈現於財務報告上？","o":["IASB","TNFD","CDP","IFRS S1/S2"],"a":3},{"id":"21032","q":"國際財務報導準則永續揭露準則（IFRS 永續揭露準則）的 S1/S2 準則，皆參考哪一個永續相關框架而制定？","o":["PCAF","TCFD","GRI","TNFD"],"a":1},{"id":"21033","q":"國際永續準則理事會(ISSB)，於 2023 年中正式發布永續揭露準則第 S1 號，下列描述何者正確？","o":["又稱為「氣候相關揭露」","揭露建議並非以投資人的觀點來設計","對重大永續相關風險及機會提供揭露指引，並未要求明確揭露公司永續及財務資訊間的關聯","參酌現有永續相關框架制定，包含治理、策略、風險管理及指標與目標等四大構面"],"a":3},{"id":"21034","q":"國際永續準則理事會(ISSB)，於 2023 年中正式發布永續揭露準則第 S2 號，下列敘述何者錯誤？","o":["無法確保各行業揭露資訊能保持一致性與可比較性","又稱為「氣候相關揭露」","依據 SASB 準則要求產業特定揭露","除了依 TCFD 一般揭露的要求外，須整體考量價值鏈中氣候相關的風險與機會"],"a":0},{"id":"21035","q":"針對 IFRS S1 的描述，何者錯誤？","o":["針對重大永續相關風險及機會提供揭露指引，並要求企業不得再以營業秘密為理由規避揭露","揭露可比較的資訊、估計基準的使用和結果的不確定性及所遵循準則的聲明等","提供投資人評估公司價值之永續相關資訊","稱為永續相關財務資訊之一般性揭露要求"],"a":0},{"id":"21036","q":"關於 IFRS S1 及 S2，下列描述何者錯誤？","o":["S1/S2 皆參考現有 TCFD 的四大構面","S1/S2 皆參考現有 SASB 的特定產業指引","S1 要求明確揭露公司永續及財務資訊間的關聯","S2 需考量價值鏈中氣候相關的風險與機會"],"a":1},{"id":"21037","q":"國際永續準則理事會(ISSB)，於 2023 年中正式發布永續揭露準則第 S1 號及 S2 號，主要是期盼何者能獲得充分且高品質的資訊？","o":["非營利組織","各地政府","經濟學家","投資人"],"a":3},{"id":"21038","q":"IFRS S2 氣候相關揭露要求(Climate-related Disclosures)，除依 TCFD 一般揭露的要求外，須整體考量價值鏈中氣候相關的風險與機會，並揭露下列資訊，何者敘述錯誤？","o":["內部碳定價之機制與流程","高階管理人員的性別比例與薪酬的平等","因應氣候相關風險和機會而產生之資本支出及投／融資金額","受氣候相關轉型／實體風險及機會影響之資產或業務金額及比例"],"a":1},{"id":"21039","q":"關於國際永續準則理事會(ISSB)，於 2023 年中正式發布永續揭露準則 S2，其揭露要求重視的是什麼，下列何者正確？","o":["僅適用聯合國成員國","僅提供指引，關鍵是當地政策制定者如何將其在地化","僅強調氣候的風險與機會","廣泛考量 ESG 所有面向，評估永續的風險與機會"],"a":2},{"id":"21040","q":"下列哪一個永續資訊框架，有明確的產業指引，讓企業依循明確的 ESG 議題範圍進行揭露？","o":["SASB","IFRS S1","TCFD","GRI"],"a":0},{"id":"21041","q":"G20 財政部長和中央銀行總裁懇請金融穩定委員會(FSB)，檢視金融部門該如何應對氣候相關議題。FSB 在審查過程中發現滿足充分資訊的需求將帶來諸多好處，下列敘述何者錯誤？","o":["能夠改善投資人的決策品質，但仍無法協助企業穩定的邁向低碳經濟轉型","良好的資訊能支持投資、貸款和保險承保決策","可改善對氣候相關風險與機會的理解與分析","有助於投資人強化企業策略的韌性與資本支出決策"],"a":0},{"id":"21042","q":"氣候相關財務揭露工作小組(TCFD)，是由哪一個組織召集？","o":["金融穩定委員會(FSB)","聯合國(UN)","永續會計準則委員會(SASB)","國際永續準則委員會(ISSB)"],"a":0},{"id":"21043","q":"針對氣候相關財務揭露工作小組(TCFD)的敘述，下列何者錯誤？","o":["為協助投資人、貸款機構和保險公司明確瞭解需要運用哪些資訊對氣候相關風險與機會進行適當評估和定價","工作小組成員由來自全球不同組織，包括大型銀行、保險公司、資產管理公司、退休基金、大型非金融公司、會計師事務所、諮詢機構以及信用評等機構等組成","擬定自願性且一致的氣候相關財務資訊揭露建議，以幫助投資人、貸款機構和保險公司瞭解重大風險","氣候相關財務資訊揭露建議有三大特色：指標一致性、產業特定指標、指標可比性"],"a":3},{"id":"21044","q":"氣候相關財務揭露工作小組(TCFD)對於機會的定義，包含的項目當中，下列何者錯誤？","o":["商譽","韌性","能源來源","資源效率"],"a":0},{"id":"21045","q":"氣候相關財務揭露工作小組(TCFD)對於主要財務影響分類的指引，針對企業損益表當中的收入面的揭露建議，下列何者錯誤？","o":["由於碳定價機制仍不普及，企業還不需要急著納入考量","轉型風險和實體風險可能影響對產品和服務的需求，組織應考慮風險對收入產生的潛在影響","組織應鑑別增加或創造新收入的潛在機會","碳定價機制持續成長，企業應納入考量來評估對收入的潛在影響"],"a":0},{"id":"21046","q":"氣候相關財務揭露工作小組(TCFD)在主要財務影響分類的指引：「對於組織而言，透過說明成本結構及調適彈性，組織才能有效地向投資人證明投資潛力，也有助於投資人了解資本支出計畫」。此段敘述屬於下列哪個類別？","o":["收入","支出","資產和負債","資本和融資"],"a":1},{"id":"21047","q":"氣候相關財務揭露工作小組(TCFD)對於主要財務影響分類的指引，針對企業資產負債表當中的資產和負債的揭露建議，下列敘述何者錯誤？","o":["氣候變遷相關的政策、技術和市場動態的變化所導致的供需改變可能會影響組織的資產和負債評價","揭露重點應包括需要的新投資、資產重組、資產減損的現有活動及決策或是已承諾的未來活動和決策","建議應注意短期資產和相關準備金的使用，因為其特別可能受到氣候相關議題的影響","對組織而言，針對資產和負債可能受到的氣候相關影響作出說明具有重要意義"],"a":2},{"id":"21048","q":"氣候相關財務揭露工作小組(TCFD)對於主要財務影響分類的指引，針對企業資產負債表當中的資本和融資的揭露建議，下列何者正確？","o":["氣候相關風險與機會可能導致組織債務期限延長","氣候相關風險與機會可能會讓組織透過增加負債規模來補償減少的營運現金流、新的資本支出或研發資金，以改變組織的負債和股權結構","氣候相關風險與機會目前還不會影響組織資本、營運損失準備金等","氣候相關風險與機會不會影響組織籌集新債或是對現有債務再融資的能力"],"a":1},{"id":"21049","q":"氣候相關財務揭露工作小組(TCFD)在主要財務影響分類的指引：「對於組織而言，氣候相關風險與機會可能影響組織籌集新債或是現有債務再融資的能力」。此段描述屬於哪個類別？","o":["收入","支出","資產和負債","資本和融資"],"a":3},{"id":"21050","q":"氣候相關財務揭露工作小組(TCFD)對於四項核心要素當中的治理，哪一個描述正確？","o":["是指組織如何鑑別、評估和管理氣候相關風險","是指組織業務、策略和財務規劃，揭露實際及潛在與氣候相關的衝擊","是指組織與氣候相關風險與機會的治理情況","是指針對重大性的資訊，揭露用於評估和管理氣候相關議題的指標和目標"],"a":2},{"id":"21051","q":"氣候相關財務揭露工作小組(TCFD)對於四項核心要素當中的策略，哪一個描述正確？","o":["是指組織如何鑑別、評估和管理氣候相關風險","是指組織業務、策略和財務規劃，揭露實際及潛在與氣候相關的衝擊","是指組織與氣候相關風險與機會的治理情況","是指針對重大性的資訊，揭露用於評估和管理氣候相關議題的指標和目標"],"a":1},{"id":"21052","q":"氣候相關財務揭露工作小組(TCFD)對於四項核心要素當中的指標和目標，哪一個描述正確？","o":["是指組織如何鑑別、評估和管理氣候相關風險","是指組織業務、策略和財務規劃，揭露實際及潛在與氣候相關的衝擊","是指組織與氣候相關風險與機會的治理情況","是指針對重大性的資訊，揭露用於評估和管理氣候相關議題的指標和目標"],"a":3},{"id":"21053","q":"氣候相關財務揭露工作小組(TCFD)的四項核心要素，下列何者錯誤？","o":["治理：該組織針對氣候相關風險與機會的治理","策略：氣候相關風險與機會對於組織的業務、策略和財務規劃的實際和潛在衝擊","風險管理：組織鑑別、評估和管理氣候相關風險的流程","指標和目標：用以評估和管理企業內部短中長期的業績成長"],"a":3},{"id":"21054","q":"氣候相關財務揭露工作小組(TCFD)建議揭露管理階層在評估和管理氣候相關風險與機會的角色，屬於四項核心要素當中的哪一項？","o":["治理","策略","風險管理","指標和目標"],"a":0},{"id":"21055","q":"氣候相關財務揭露工作小組(TCFD)對於治理項目中，建議的揭露事項，下列何者正確？","o":["揭露組織依循策略和風險管理流程進行評估氣候相關風險與機會所使用的指標","描述董事會對氣候相關風險與機會的監督情況","描述組織所鑑別的短、中、長期氣候相關風險與機會","描述組織在氣候相關風險的管理流程"],"a":1},{"id":"21056","q":"臺灣上市櫃公司導入 TCFD 揭露框架，在治理面向的關鍵為何？","o":["股東的支持","供應鏈的支持","董事會的支持與監督","所有利害關係人的支持"],"a":2},{"id":"21057","q":"氣候相關財務揭露工作小組(TCFD)對於策略項目中，建議的揭露事項，下列何者錯誤？","o":["描述組織在策略上的韌性，並考慮不同氣候相關情境","描述組織在氣候相關風險的鑑別和評估流程","描述組織所鑑別的短、中、長期氣候相關風險與機會","描述組織在業務、策略和財務規劃上與氣候相關風險與機會的衝擊"],"a":1},{"id":"21058","q":"氣候相關財務揭露工作小組(TCFD)建議揭露組織所鑑別的短、中、長期氣候相關風險與機會，屬於四項核心要素當中的哪一項？","o":["治理","策略","風險管理","指標和目標"],"a":1},{"id":"21059","q":"氣候相關財務揭露工作小組(TCFD)建議揭露組織在業務、策略和財務規劃上與氣候相關風險與機會的衝擊，屬於四項核心要素當中的哪一項？","o":["治理","策略","風險管理","指標和目標"],"a":1},{"id":"21060","q":"氣候相關財務揭露工作小組(TCFD)對於風險管理項目中，建議的揭露事項，下列何者錯誤？","o":["描述組織在氣候相關風險的管理流程","描述氣候相關風險的鑑別、評估和管理流程如何整合在組織的整體風險管理制度","描述管理階層在評估和管理氣候相關風險與機會的角色","描述組織在氣候相關風險的鑑別和評估流程"],"a":2},{"id":"21061","q":"氣候相關財務揭露工作小組(TCFD)建議揭露氣候相關風險的鑑別、評估和管理流程如何整合在組織的整體風險管理制度，屬於四項核心要素當中的哪一項？","o":["治理","策略","風險管理","指標和目標"],"a":2},{"id":"21062","q":"氣候相關財務揭露工作小組(TCFD)建議揭露組織在氣候相關風險的管理流程，屬於四項核心要素當中的哪一項？","o":["治理","策略","風險管理","指標和目標"],"a":2},{"id":"21063","q":"氣候相關財務揭露工作小組(TCFD)建議，揭露組織依循策略和風險管理流程進行評估氣候相關風險與機會所使用的指標，屬於四項核心要素當中的哪一項？","o":["治理","策略","風險管理","指標和目標"],"a":3},{"id":"21064","q":"氣候相關財務揭露工作小組(TCFD)建議揭露組織在管理氣候相關風險與機會所使用的目標，以及落實該目標的表現，屬於四項核心要素當中的哪一項？","o":["治理","策略","風險管理","指標和目標"],"a":3},{"id":"21065","q":"氣候相關財務揭露工作小組(TCFD)建議揭露範疇一、範疇二、範疇三(如適用)溫室氣體排放和相關風險，屬於四項核心要素當中哪一項？","o":["治理","策略","風險管理","指標和目標"],"a":3},{"id":"21066","q":"氣候相關財務揭露工作小組(TCFD)對於指標和目標項目中，建議的揭露事項，下列何者錯誤？","o":["揭露範疇一、範疇二和範疇三（如適用）溫室氣體排放和相關風險","描述組織在管理氣候相關風險與機會所使用的目標，以及落實該目標的表現","揭露組織依循策略和風險管理流程進行評估氣候相關風險與機會所使用的指標","描述組織在氣候相關風險的管理流程"],"a":3},{"id":"21067","q":"SASB(Sustainability Accounting Standards Board)的中文譯名為何？","o":["國際整合性報導委員會","全球永續性報告協會","永續會計準則委員會","國際永續準則委員會"],"a":2},{"id":"21068","q":"永續會計準則委員會是指下列哪一個單位？","o":["IIRC","VRF","IFRS","SASB"],"a":3},{"id":"21069","q":"永續會計準則委員會成立宗旨在促進企業對於長期影響其財務報表或企業價值的永續性資訊，應併同於其財務資訊共同揭露。會計準則和永續會計準則同樣都要求企業向投資人揭露其具有什麼樣特性的資訊？","o":["對自然資本的衝擊","人權重大性","財務重大性","環境重大性"],"a":2},{"id":"21070","q":"2021 年 11 月 3 日 COP 26 會議上，國際財務報導準則基金會(IFRS Foundation)進一步正式宣布成立國際永續準則委員會(ISSB)，並宣布將價值報告基金會(VRF)併入 IFRS Foundation。說明此一系列的整合行動，是為了回應何種的需求？","o":["利於全球企業供應鏈管理","全球投資機構對高品質永續相關資訊揭露的需求","幫助各地政府掌握永續資訊","協助企業進行內部碳定價"],"a":1},{"id":"21071","q":"針對永續會計準則委員會(SASB)所設立的準則特性，下列何者錯誤？","o":["指標定義、範疇、計算方式、資料蒐集方式、參考文獻，以及指標呈現單位均一致","有三大特色：指標一致性、產業特定指標與指標可比性","各產業應計算之指標單位，可協助投資人比較與辨識","針對不同產業應揭露主題及會計指標設定相同的揭露議題"],"a":3},{"id":"21072","q":"永續會計準則委員會(SASB)為了制定更全面、完整，且質化與量化並行的永續資訊揭露標準，結合 ESG 各面向指標，滿足投資者的資訊需求，利於企業更全面展現長期績效與價值。為達成這一目的，SASB 準則具備某些特色，下列哪一項不是其特色？","o":["設計出產業特定指標","指標具備明確投資指引","指標具備一致性","指標具備可比較性"],"a":1},{"id":"21073","q":"針對永續會計準則委員會(SASB)準則特性之一的指標可比性的定義描述，哪一個正確？","o":["制定出更全面、完整，且質化與量化並行的永續資訊揭露標準，結合 ESG 各面向指標，滿足投資者的資訊需求，利於企業更全面展現長期績效與價值","關注環境、社會、人力資源、商業模式與創新及領導力及公司治理等五大面向，針對不同產業特性設計應揭露主題及指標","關於指定各產業應計算之指標單位，可協助投資人比較與辨識","是關於指標定義、範疇、計算方式、資料收集方式、參考文獻，以及指標呈現單位均一致，方便投資人作比較分析"],"a":2},{"id":"21074","q":"SASB 準則是根據何種標準流程訂定？","o":["依據氣候相關財務揭露建議 TCFD 的四個主軸來訂定符合公司治理的流程，同時過程中充分與 NGO 組織交互討論各項標準","依據巴黎協定(The Paris Agreement)的條約，在符合 2°C 的目標下，充分與氣候專家議合而產生的標準","參照一般制定財務會計標準的流程而訂定，過程中皆參考大量文獻並與資本市場各產業人士和專家學者交互討論後，決議出目前所公布的各項揭露指標","參照 GRI 準則，挑選當中可量化且可以連結至企業的財務績效的標準作為制定的基礎"],"a":2},{"id":"21075","q":"永續會計準則委員會(SASB)2018 年 11 月公布準則的規範與運用，並藉此列出可能影響企業財務狀況與營運績效的 ESG 議題，下列描述何者錯誤？","o":["公布 5 大面向，包括環境(Environment)、人力資本(Human Capital)、社會資本(Social Capital)、商業模式與創新(Business Model & Innovation)和領導與治理(Leadership & Governance)","20 項通用的 ESG 議題的重大性地圖索引(Materiality Map)","77 項行業別(industry)","11 項產業別(sector)"],"a":1},{"id":"21076","q":"永續會計準則委員會(SASB)依據各產業於環境、人力資本、社會資本、商業模式與創新和領導與治理等五大永續面向相關機會與風險，反映企業因自身產品或服務而產生的環境和社會衝擊，並要求揭露對何種績效產生重大影響的指標？","o":["減碳績效","業務績效","財務績效","社會影響力"],"a":2},{"id":"21077","q":"相較於其他永續框架與揭露指南，SASB 準則具有以下特性，哪一項是錯誤的？","o":["符合成本效益原則","揭露具財務重大的永續資訊","無特定行業分類，皆能適用","決策有用性"],"a":2},{"id":"21078","q":"SASB 準則提供公司於編製永續報告書時，應向誰揭露對於財務具重大性的永續資訊？","o":["各國中央銀行","投資人","國際財務報導準則基金會","當地金融主管機關"],"a":1},{"id":"21079","q":"SASB 準則有助於將廣泛的永續維度與資本轉化為量化的績效指標，因此，投資人、債權人與貸款人等，在參考傳統財務表現之餘，也可參考這些資訊評估企業在創造未來價值的潛力、辨識企業的 ESG 績效，並實踐在投資的決策之中，建立更長遠的價值與影響力。以上描述 SASB 準則的資訊與議題特性是下列哪一項？","o":["揭露具財務重大的永續資訊","基於實證及提供資本市場充分資訊的開發流程","符合成本效益原則","決策有用性"],"a":3},{"id":"21080","q":"永續會計準則委員會(SASB)2018 年 11 月公布 5 大永續面向，哪一個不包含在內？","o":["商業模式與創新(Business Model & Innovation)","人力資本(Human Capital)","社會資本(Social Capital)","自然資本(Natural Capital)"],"a":3},{"id":"21081","q":"SASB 準則五大面向當中的環境(Environment)提及溫室氣體排放(GHG emission)，不涉及哪項內涵？","o":["員工個人減碳作為","企業監管風險","企業聲譽風險和機會","環境合規性"],"a":0},{"id":"21082","q":"SASB 準則五大面向當中的環境(Environment)提及生態衝擊(Ecological Impacts)議題，下列何者描述不正確？","o":["此議題涵蓋氣候變遷對生態系統和生物多樣性的影響","此議題涉及公司通過活動對生態系統和生物多樣性的影響的管理","影響包括但不限於規劃、土地徵用、許可、開發、營運和場地修復等各個階段的生物多樣性喪失、棲息地破壞和森林砍伐","包括但不限於勘探用地、自然資源開採和種植，以及項目開發、建設和選址"],"a":0},{"id":"21083","q":"SASB 準則五大面向當中的社會資本(SocialCapital)，共包含 7 項 ESG 議題，下列何者不包含在內？","o":["資訊安全(Data Security)","商業道德(Business Ethics)","客戶福利(Customer Welfare)","人權和社區關係(Human Rights & Community Relations)"],"a":1},{"id":"21084","q":"SASB 準則五大面向當中的社會資本(Social Capital)，針對其中一項 ESG 議題：人權與社區關係(Human Rights & Community Relations)，下列描述何者正確？","o":["此議題包括空氣污染或廢物等環境影響，因為這些影響可能會影響當地社區成員的健康和安全","此議題還包括企業應確保大眾能廣泛獲取其產品和服務的能力，特別是在服務不足的市場，例如醫療保健、金融服務、公用事業、教育和電信的可取得性和可負擔性","此議題解決了因企業未能管理其行銷聲明、廣告以及產品和服務的透明度、準確性和可理解性而可能出現的社會問題","依據 SASB 準則定義，此類管理可能涵蓋社會經濟、社區影響、社區參與、環境正義、當地勞動力培養、對當地企業的影響、經營許可以及環境/社會的影響評估"],"a":3},{"id":"21085","q":"SASB 準則五大面向當中的人力資本(Human Capital)，針對其中一項 ESG 議題：勞工關係(Labor Practices)，下列描述何者正確？","o":["包括最低工資政策和福利規定，這可能會影響勞動力的吸引、保留和激勵方式","此議題涉及公司在工作場所維護普遍接受的勞工標準的能力，但不包括遵守勞動法和國際公認的規範和標準","不包括童工保護議題","此議題無法進一步解決公司與勞工組織和結社自由的關係"],"a":0},{"id":"21086","q":"議題涉及公司在工作場所維護普遍接受的勞工標準的能力，包括遵守勞動法規和國際公認的規範和標準，以上敘述屬於 SASB 準則 26 項 ESG 議題當中的哪一項？","o":["員工健康與安全(Employee Health & Safety)","員工對企業之認同感、多樣性及包容性(Employee Engagement, Diversity & Inclusion)","勞工關係(Labor Practices)","人權和社區關係(Human Rights & Community Relations)"],"a":2},{"id":"21087","q":"SASB 準則五大面向當中的人力資本(Human Capital)，針對其中一項 ESG 議題：員工對企業之認同感、多樣性與包容(Employee Engagement, Diversity & Inclusion)，下列描述何者不正確？","o":["此議題探討公司如何確保其企業文化、聘僱和晉升實務能夠建立具多元與包容性的團隊之能力","此議題進一步解決了公司與有組織勞工和結社自由的關係","同時反映了當地人才庫及其客戶群的構成","此議題包括如何處理歧視，包括但不限於基於種族、性別、民族、宗教、性取向和其他因素的歧視"],"a":1},{"id":"21088","q":"SASB 準則五大面向當中的商業模式與創新(Business Model and Innovation)，下列何者是其包含的 ESG 議題？","o":["合理的行銷和廣告(Selling Practices & Product Labeling)","產品設計和生命週期管理(Product Design & Lifecycle Management)","系統風險管理(Systemic Risk Management)","生態衝擊(Ecological Impacts)"],"a":1},{"id":"21089","q":"「公司通過產品設計、製造和報廢管理來管理這些風險的能力，例如使用回收和可再生材料」屬於 SASB 準則當中哪一項 ESG 議題的描述？","o":["商業道德(Business Ethics)","原料採購(Materials Sourcing & Efficiency)","產品品質與安全(Product Quality & Safety)","合理的行銷和廣告(Selling Practices & Product Labeling)"],"a":1},{"id":"21090","q":"SASB 準則五大面向當中的領導與治理(Leadership and Governance)，下列何者是其包含的 ESG 議題？","o":["生態衝擊(Ecological Impacts)","法規和監管環境的管理(Management of the Legal & Regulatory Environment)","勞工關係(Labor Practices)","資訊安全(Data Security)"],"a":1},{"id":"21091","q":"公司內部的公務車空調的排放源被歸類在哪一個範疇？","o":["範疇三","範疇二","範疇一","不需納入計算"],"a":2},{"id":"21092","q":"關於溫室氣體盤查範疇，下列敘述何者正確？","o":["其他間接溫室氣體排放，可歸類為範疇一：指來自於製程或設施之直接排放","能源間接溫室氣體排放，可歸類為範疇三：指來自於使用電力或蒸汽之能源利用所產生之間接排放","租賃、委外業務、員工通勤、商務旅行等活動屬於公司的直接溫室氣體排放","來自於製程或設施之直接排放，歸類為直接溫室氣體排放"],"a":3},{"id":"21093","q":"關於溫室氣體盤查，下列描述何者不正確？","o":["企業若要執行國際溫室氣體盤查，涵蓋範疇僅分為直接排放(範疇一)、能源間接排放(範疇二)共兩種","我國氣候變遷因應法明訂二氧化碳(CO2)、甲烷(CH4)、氧化亞氮(N2O)、氫氟碳化物(HFCs)、全氟碳化物(PFCs)、六氟化硫(SF6)及三氟化氮(NF3)等氣體為溫室氣體","直接溫室氣體排放(範疇一)：指來自於製程或設施之直接排放，屬於公司所擁有或控制的排放源，包括固定/移動燃燒源、製程/逸散排放源等","能源間接溫室氣體排放(範疇二)：指公司因外購的電力、蒸氣、熱，是來自於別人所擁有的資產、設備所產生的溫室氣體排放"],"a":0},{"id":"21094","q":"Z 公司位於一棟辦公大樓內，每月除了向台電繳交電費之外，還需要向大樓管委會繳納公共空間電費以及清潔費，關於溫室氣體盤查涵蓋範圍的敘述，以下何者正確？","o":["計算範疇一溫室氣體排放量時，需計算用電造成的溫室氣體排放","範疇二溫室氣體排放量包含台電用電以及大樓分攤電力","範疇二電力不包含向大樓管委會繳納的公共空間電力分攤","台電用電度數，以及大樓分攤的用電都屬於範疇三的溫室氣體排放"],"a":1},{"id":"21095","q":"溫室氣體盤查涵蓋範圍當中，常見的其他間接排放（範疇三）包含的項目中，哪一個不包含在內？","o":["物料運輸的排放","員工通勤","商務旅行","組織所擁有的緊急發電機"],"a":3},{"id":"21096","q":"組織依循 ISO 14064-1:2018 標準執行溫室氣體盤查，當發生下列因素所造成的實質性累積變化，何者不應重新計算基準年溫室氣體清冊？","o":["報告邊界或組織邊界的結構變化","發現單一或累積的實質性錯誤","設施生產水準的改變，例如關閉或啟動","計算方法或排放係數的變化"],"a":2},{"id":"21097","q":"依據溫室氣體盤查作業基本程序，下列描述何者正確？","o":["若企業具有環境部公告納管事業者，該納管事業之盤查邊界由企業自行設定，並依據營運控制權法區分為直接排放或能源間接排放的單元或程序","金管會要求盤查邊界設定不需要與財務報表一致，但對於子公司溫室氣體排放量納入統計方法並無規範，僅要求企業內部各子公司必須一致","溫室氣體盤查主要依循四個步驟：決定排放量計算方式、蒐集活動數據、選擇合適的排放係數、計算溫室氣體排放量","不論依循任何溫室氣體盤查規範，企業都不一定要界定盤查的範圍"],"a":2},{"id":"21098","q":"若企業為環境部公告納管事業者，關於溫室氣體盤查，下列描述何者錯誤？","o":["盤查邊界設定要與財務報表一致","盤查邊界設定為環境部核發的管制編號所涵蓋地理邊界","依據營運控制權法區分為直接排放或能源間接排放的單元或程序","不論依循任何溫室氣體盤查規範，企業都需要界定要盤查的範圍"],"a":0},{"id":"21099","q":"溫室氣體盤查主要依循的四個步驟，正確順序為何？甲.決定排放量計算方式；乙.選擇合適的排放係數；丙.蒐集活動數據；丁.計算溫室氣體排放量","o":["丁、丙、乙、甲","甲、丙、乙、丁","丙、乙、甲、丁","乙、甲、丙、丁"],"a":1},{"id":"21100","q":"溫室氣體盤查作業有文件化與紀錄的規範與要求。下列敘述何者錯誤？","o":["文件化方式可透過紙張、硬碟、雲端硬碟或其他形式加以留存","除作為內部紀錄外，亦可提供外部查證或查核需求","文件化僅須留存會議紀錄","決定邊界設定及採用原則、溫室氣體排放源鑑別、各個排放源排放量量化方式、量化數據的選擇、溫室氣體排放量清冊品質管理及其資訊管理的相關程序等都須進行文件化"],"a":2},{"id":"21101","q":"正式的盤查工作中，對於盤查作業有文件化與紀錄的規範與要求。關於文件化，何者描述正確？","o":["為了保護公司營業秘密，盤查相關之方法、數據、程序、系統、假設以及估算等過程不需一一記錄並文件化","僅需提供外部查證或查核需求，內部不須紀錄","文件化方式為了少紙化，禁止透過紙張留存；只能以硬碟、雲端硬碟或其他形式加以留存","自事業決定其邊界設定及採用原則、溫室氣體排放源鑑別、各個排放源排放量量化方式、量化數據的選擇、溫室氣體排放量清冊品質管理及其資訊管理的相關程序等都需進行文件化"],"a":3},{"id":"21102","q":"ISO 14067 文件內容涉及之衝擊影響類別為何？A.臭氧層破壞 B.氣候變遷 C.資源耗竭-化石燃料","o":["僅 A","僅 B","僅 C","僅 AC"],"a":1},{"id":"21103","q":"下列何者非服務型碳足跡的生命週期階段？","o":["原料取得","製造","服務","廢棄處理"],"a":1},{"id":"21104","q":"碳足跡研究報告揭露應包含下列哪一項？","o":["功能單位","系統邊界","截斷準則","以上皆是"],"a":3},{"id":"21105","q":"依 ISO 14044 執行產品碳足跡計算時，應根據什麼單位作為參考？","o":["功能單位","類別單位","基本單位","絕對單位"],"a":0},{"id":"21106","q":"國內外常見的溫室氣體盤查規範，下列哪一個不是？","o":["ISO 14064-1：2018","CNS 14064-1：2021","PAS 2060","溫室氣體盤查議定書－企業會計與報告標準"],"a":2},{"id":"21107","q":"下列哪一項不屬於 TNFD 制訂的建議與附加指引內容？","o":["和原住民族與在地社區及利害關係人的議合","生物群落指引","情境分析","數位轉型計畫"],"a":3},{"id":"21108","q":"情境分析在 TNFD 建議與 LEAP 方法學中扮演重要角色，以下哪一項敘述正確？","o":["情境分析可用於評估重大自然相關風險與機會，並辨識減緩措施","情境分析與 LEAP 方法學的「定位」階段無關","TNFD 不建議將情境分析作為策略揭露建議的依據","情境分析僅限於短期時間範疇的風險評估"],"a":0},{"id":"21109","q":"以下哪一項不是 TNFD 四個揭露構面的主要內容？","o":["治理","依賴與影響","風險與影響管理","指標與目標"],"a":1},{"id":"21110","q":"以下哪一項正確描述了「依賴」和「影響」的區別？","o":["依賴僅指組織對自然資產的正向依賴，影響僅指負向影響","影響僅包括組織對自然的直接影響，依賴則是間接影響","依賴指的是組織對自然資產或生態系服務的依賴，而影響則是組織對自然的正面或負面改變","依賴和影響是相同的概念，無需區分"],"a":2},{"id":"21111","q":"根據 TNFD 的指引，LEAP 方法的哪一階段是在分析工作開始前確定評估範圍的？","o":["定位(Locate)","評價(Evaluate)","評估(Assess)","範圍界定(Scoping)"],"a":3},{"id":"21112","q":"TNFD 建議組織在進行 LEAP 評估時考慮哪兩個引導問題？","o":["工作假設和協調目標和資源","評估成本和預算要求","組成評估團隊的內部人員與外部人力","知識和數據的可能來源"],"a":0},{"id":"21113","q":"TNFD 的 LEAP 方法中，哪一階段專注於識別組織 、丙、戊、乙、丁","甲、丁、丙、戊、乙"],"a":2},{"id":"42001","q":"下列敘述何者最切合 ESG 投資的定義？","o":["其為管理公司的方式之一，將環境、社會及治理等因素納入企業營運決策中","其為管理資產的方式之一，將環境、社會及治理等因素納入投資決策中","其為管理公司的方式之一，將經濟、社會及綠色等因素納入企業營運決策中","其為管理資產的方式之一，將經濟、社會及綠色等因素納入投資決策中"],"a":1},{"id":"42002","q":"有關永續金融商品之敘述，下列何者正確？","o":["債券、基金、ETF 等金融商品皆可於投資流程中納入 ESG 因素","由於永續投資領域尚處於發展階段，投資方法論及具體影響皆未明確，故目前僅有機構投資人可購買永續金融商品","投資流程中納入永續概念可降低風險，然而衍生性商品風險相對較高，兩者概念相違背，故目前衍生性商品尚無法納入 ESG 因素","永續債券可分為綠色、社會、可持續發展及可持續發展連結債券，臺灣發行規模最大的類型為可持續發展債券"],"a":0},{"id":"42003","q":"金融機構發行永續金融商品和傳統金融商品主要的不同考量為何？","o":["考量金融商品發行期間的不同","考量金融商品名稱是否有永續","考量金融商品是否有納入 ESG 因子","考量金融商品的風險是否較高"],"a":2},{"id":"42004","q":"以下有關影響力投資之說明何者是正確的？","o":["以投資來解決社會及環境議題，並期待獲得政策的投資利潤","以捐助方式來解決社會問題","以投資利潤為主，不太考慮 ESG","僅注重社會效益"],"a":0},{"id":"42005","q":"下列有關永續與責任投資之敘述何者正確？","o":["僅注重社會效益","較為重視社會效益，不太在意投資利潤","僅在意投資利潤","在選定的 ESG 及永續基礎上，追求市場利潤"],"a":3},{"id":"42006","q":"PRI 責任投資原則隸屬於何組織？","o":["聯合國","歐盟","歐洲中央銀行","美國證券交易委員會"],"a":0},{"id":"42007","q":"以下何者為永續投資方式？甲.負向表列/排他性篩選；乙.整合 ESG 因子；丙.高股息主題投資；丁.影響力與社區投資","o":["僅甲、乙","僅甲、乙、丁","僅甲、丙、丁","甲、乙、丙、丁皆是"],"a":1},{"id":"42008","q":"排除篩選(Exclusion Screening)是一種永續投資策略，其主要目的是？","o":["最大化短期股價","優化投資組合分散性","提高公司的 ESG 評級","排除特定負面行業或公司"],"a":3},{"id":"42009","q":"以下何種 ESG 投資方法是透過國際標準對企業或發行人的業務或實踐進行投資的篩選？","o":["負向表列／排他性篩選","產業別最佳／正向選股","企業參與及股東行動","以標準為依據選股"],"a":3},{"id":"42010","q":"永續相關主題投資的主要特點是什麼？","o":["投資於任何公司，不論其行業或主題","投資於各種不同主題的公司，以實現多元化","選擇投資於特定永續發展主題相關的公司","專注投資於高風險高回報的公司"],"a":2},{"id":"42011","q":"影響力投資的主要特點是什麼？","o":["以追求最高市場報酬為目標的投資","投資主要集中在新興市場","旨在產生積極的社會和/或環境影響，同時實現財務報酬","基本上與慈善事業相同，只追求社會影響"],"a":2},{"id":"42012","q":"哪種 ESG 投資方法專門投資於對永續解決方案有所貢獻的主題或資產，例如環境和社會領域？","o":["排他性篩選","影響力與社區投資","企業參與及股東行動","產業別最佳"],"a":1},{"id":"42013","q":"以下何種 ESG 投資方法是先設定 ESG 排除標準，並依據排除標準將基金或投資組合中被判定為不可投資的特定行業、公司、國家或其他發行人排除在外？","o":["負向表列/排他性篩選","影響力與社區投資","企業參與及股東行動","整合 ESG 因子"],"a":0},{"id":"42014","q":"以下何種 ESG 投資方法是選取相對於同業在 ESG 表現上較為積極的公司或項目作為投資標的，為評斷公司 ESG 表現的好壞，如以某個具公信力的永續指數來訂定量化標準？","o":["負向表列/排他性篩選","產業別最佳/正向選股","企業參與及股東行動","整合 E 金債券","可持續發展連結債券","永續發展投資級債券","永續發展高收益債券"],"a":0},{"id":"43013","q":"關於發行綠色債券，下列敘述何者正確？","o":["所募集之資金不限其用途","所募集之資金用於綠色投資計畫之放款須達 50%以上","所募集之資金須全部用於綠色投資計畫之放款","綠色投資計畫必須可以降低碳排放量"],"a":2},{"id":"43014","q":"下列何者非綠色債券中之綠色投資計畫？","o":["溫室氣體減量","化石燃料發電","能源使用效率提昇及能源節約","農林資源保育"],"a":1},{"id":"43015","q":"公司 A 發行公司債籌資，且其籌得資金將全部用於廢棄物回收處理投資，試問該債券可以申請何種債券認可？","o":["綠色債券","社會責任債券","可持續發展債券","以上皆是"],"a":0},{"id":"43016","q":"公司 C 通過證券櫃檯買賣中心的認定發行綠色債券籌資，請問以下何者最不可能是該債券的資金用途？","o":["能源科技發展","溫室氣體減量","生物多樣性保育","創造就業"],"a":3},{"id":"43017","q":"目前臺灣發行的永續債券中，下列哪種發行檔數最多？","o":["綠色債券","社會責任債券","可持續發展債券","可持續發展連結債券"],"a":0},{"id":"43018","q":"以下何種計畫是社會責任債券所募集的資金用途？","o":["風力發電機台設置","發展核能發電","生物多樣性計畫","青年住宅投資"],"a":3},{"id":"43019","q":"下列何者非社會責任債券中之社會責任投資計畫？","o":["可負擔的住宅","可負擔的基礎生活設施","糧食安全及可持續糧食系統","污染防治與控制"],"a":3},{"id":"43020","q":"何種債券所募集之資金將全部同時用於綠色投資計畫及社會效益投資計畫？","o":["綠色債券","社會責任債券","可持續發展債券","轉型債券"],"a":2},{"id":"43021","q":"以下有關可持續發展債券之敘述何者為正確的？","o":["可持續發展債券係指債券本息支付條件與發行人可持續發展績效目標(SPT)相連結之債券","可持續發展債券係指債券所募集之資金擇一用於綠色投資計畫或社會效益投資計畫","可持續發展債券係指債券所募集之資金全部同時用於綠色投資計畫及社會效益投資計畫","可持續發展債券係指債券所募集之資金全部同時用於公司治理投資計畫"],"a":2},{"id":"43022","q":"可持續發展債券(Sustainability Bond)所募集的資金應運用於下列何項目？甲.綠色投資計畫；乙.社會效益投資計畫；丙.可持續發展績效目標(SPT)","o":["僅甲","僅乙","僅甲、乙","甲、乙、丙皆是"],"a":2},{"id":"43023","q":"有關可持續發展連結債券(Sustainability linked bonds)之敘述，何者最為符合？","o":["僅可持續發展績效優於同業者，得發行可持續發展連結債券","債券本息支付條件與發行人可持續發展績效目標相連結之債券","可持續發展連結債券所募集之資金全數用於綠色投資計畫或社會效益投資計畫","以上皆非"],"a":1},{"id":"43024","q":"何種永續債券資金用途未受限制，可用於一般企業營運所需而非特定投資計畫，但債券本息支付條件與發行人可持續發展績效目標(SPT)相連結？","o":["綠色債券","社會責任債券","可持續發展債券","可持續發展連結債券"],"a":3},{"id":"43025","q":"以下何種債券類別募集的資金，發行人較能自由決定債券的資金用途，增強公司資金運用靈活度，但需訂定可持續發展關鍵績效指標(KPI)、可持續發展績效目標(SPT)，以及連結債券本息支付條件設計等機制，來確保發行公司將永續發展納入到其經營策略與商業模式中？","o":["綠色債券","社會責任債券","轉型債券","可持續發展連結債券"],"a":3},{"id":"43026","q":"以下何者永續發展債券種類別，不是限定募集資金用途的債券(UOP)？","o":["綠色債券","社會責任債券","可持續發展連結債券","可持續發展債券"],"a":2},{"id":"43027","q":"可持續發展連結債券(SLB)債券發行時與可持續發展績效目標(SPT)和關鍵績效指標(KPI)連結，下列何者非常見的連結指標？","o":["生物多樣性","用水量","碳排放範疇一","碳排放範疇三"],"a":3},{"id":"43028","q":"如公司欲發行社會責任債券，應向櫃檯買賣中心申請並提交永續發展債券計畫書，請問下列何者非該計畫書應記載事項？","o":["發行人之整體永續發展策略概要資訊","投資計畫之評估與篩選流程","資金運用計畫","可持續發展關鍵績效指標之選定"],"a":3},{"id":"44001","q":"面對全球淨零目標及減碳策略所衍生的資金需求，以下何者不是銀行業者普遍採用的因應措施？","o":["對環境與永續相關建設專案提供優惠利率","將碳排要素納入授信審核要件","開發永續目標連結之新型貸款商品","提升短天期貸款的貸放額度，因應及時融資需求"],"a":3},{"id":"44002","q":"永續授信是目前支持能源轉型的重要資金來源，以下何者為永續授信的資金需求者？甲.能源開發商；乙.鋼鐵製造商；丙.永續人力招募","o":["僅甲","僅甲、乙","僅甲、丙","甲、乙、丙皆是"],"a":3},{"id":"44003","q":"下列何種貸款之資金應全部用於環境保護或氣候相關支出？","o":["綠色貸款","社會貸款","永續連結貸款","轉型貸款"],"a":0},{"id":"44004","q":"公司 A 向銀行申請一筆貸款，其資金用途係用作控制溫室氣體排放、耗電量、廚餘及太陽能發電之項目，請問公司 A 最適合申請之授信為何種類型？","o":["綠色授信","社會授信","永續授信","永續連結授信"],"a":0},{"id":"44005","q":"下列何種貸款之資金應全部用於社會關懷相關專案？","o":["綠色貸款","社會貸款","永續貸款","永續連結貸款"],"a":1},{"id":"44006","q":"公司 B 向銀行申請一筆貸款，其資金用途係用作身心障礙者的職能培訓之項目，請問公司 B 最適合申請之授信為何種類型？","o":["綠色授信","社會授信","永續授信","永續連結授信"],"a":1},{"id":"44007","q":"下列何種貸款之資金應全部用於能夠發揮環境及社會影響力之專案？","o":["綠色貸款","社會貸款","永續貸款","永續連結貸款"],"a":2},{"id":"44008","q":"以下何者永續貸款之定義是錯誤的？","o":["綠色貸款係指貸款用於環境保護或氣候相關支出","社會貸款係指貸款用於能夠發揮社會影響力之專案","永續連結貸款係指同時用於綠色與社會關懷相關專案","永續連結貸款則係指銀行授信條件參考企業在 ESG 的永續績效目標(SPT)"],"a":2},{"id":"44009","q":"銀行 A 推出一貸款專案，該專案供企業發展所需之營運週轉金、資本支出及計畫性融資等，惟貸款企業應達成與該銀行約定的永續績效指標，請問該專案最可能為什麼類型的授信？","o":["綠色授信","社會授信","永續授信","永續連結授信"],"a":3},{"id":"44010","q":"下列何者為永續連結貸款的條件？","o":["貸款方必須屬於綠色產業","貸款方須屬於綠色產業，且不可有違反 ESG 相關法規之前例","貸款方可以是一般產業，但款項必須用在促進永續的用途","貸款方可以是一般產業，但需要設定永續關鍵績效指標與目標"],"a":3},{"id":"44011","q":"下列關於永續連結貸款專案的敘述，何者錯誤？","o":["永續連結貸款就是綠色貸款","長期監控 ESG 指標，並將永續績效與貸款利率定價連結","永續連結貸款的資金用途不限於特定目的","若企業達成相關 ESG 績效指標即可降低融資成本"],"a":0},{"id":"44012","q":"以下有關永續連結貸款授信特點之敘述何者是正確的？","o":["借款人必須永久承擔債務，無法償還","貸款的利率將永遠保持不變","貸款利率與借款人實現可持續性目標的績效相關聯","借款人只能將貸款用於綠色專案，無法用於其他目的"],"a":2},{"id":"44013","q":"永續授信市場的主要特點是什麼？","o":["永續授信市場一直以來都是高度競爭的，缺乏標準化","永續授信市場在過去幾年中一直呈現穩定增長，受到全球金融機構的廣泛支持","永續授信市場主要關注資金用途的彈性，而不太關注借款人的環境績效","永續授信市場通常涉及大型企業，不太適用於中小企業"],"a":1},{"id":"44014","q":"下列何者最符合赤道原則？","o":["赤道原則是國際金融機構的自願性行為規範","赤道原則是一項國際法規","赤道原則是一種投資策略","赤道原則是一項聯合國倡議，旨在減少發展中國家基礎設施對環境的不利影響"],"a":0},{"id":"44015","q":"赤道原則主要關注評估專案對什麼方面的影響？","o":["經濟影響","對企業獲利影響","環境和社會影響","政治影響"],"a":2},{"id":"44016","q":"赤道原則中是依照什麼風險將專案融資案件分類成 A、B、C 三級？","o":["信用風險","市場風險","環境與社會風險","流動性風險"],"a":2},{"id":"44017","q":"赤道原則按照潛在的環境社會風險和影響程度將專案融資案件分類成 A、B、C 三個等級，以下有關分類等級 A 類的說明，哪項是正確的？","o":["A 級係指無風險案件，即經評估後無不利風險及/或影響","A 級係指中風險案件，即經評估後顯示專案對環境和社會可能造成不利的程度有限，影響侷限於特定地點，且可藉減緩措施降低或免除衝擊","A 級係指低風險案件，即經評估後顯示專案對社會和環境影響輕微","A 級係指高風險案件，即經評估後顯示專案對環境和社會有潛在重大不利及/或涉及多樣的、不可逆的或前所未有的影響"],"a":3},{"id":"44018","q":"關於赤道原則何者正確？","o":["在環境及社會風險等級中，A 為風險最低、C 為風險最高","無論風險等級為何，皆須進行相同且最高程度的環境和社會風險審查","過渡性融資包含在簽署銀行受赤道原則規範的四大類案件中","銀行無權使用合約規範及放款後的持續性監控確保客戶遵守承諾"],"a":2},{"id":"44019","q":"何謂責任銀行原則(PRB)？","o":["PRB 是一個金融機構，致力於提供專門的貸款和投資來支持永續項目","PRB 是一套由聯合國環境規劃署推動的準則，旨在引導銀行業實踐永續","PRB 是一個國際組織，負責監督銀行業在社會和環境領域的活動","PRB 是一項法律要求，規定銀行必須在其業務中遵守環境和社會標準"],"a":1},{"id":"44020","q":"以下何者非責任銀行原則承諾之履行步驟？","o":["影響分析","目標制定與實施","補助申請","定期揭露"],"a":2},{"id":"44021","q":"下列何者不屬於責任銀行原則(PRB)的六大框架？","o":["一致性","衝擊與目標設定","與客戶合作","節能與減碳"],"a":3},{"id":"44022","q":"關於責任銀行原則(PRB)的六大架構，下列敘述何者錯誤？","o":["透明度及當責：應定期評估銀行對責任銀行原則的履行情況，公開揭露對社會目標貢獻的正面及負面影響，並對相關影響負責","利害關係人：應被動地與利害關係人進行溝通、互動及合作","影響與目標設定：應持續提供積極影響、管理並降低因產品和服務所造成的負面影響及風險，並設定相關目標及持續追蹤","一致性：銀行應確保策略與聯合國永續發展目標 SDGs、《巴黎協定》一致並有所貢獻"],"a":1},{"id":"44023","q":"關於責任銀行原則(PRB)的六大框架，何者說明有誤？","o":["一致性：銀行應確保策略與聯合國永續發展目標 SDGs、《巴黎協定》一致並有所貢獻","利害關係人：銀行應主動、定期與利害關係人進行接觸、協商、互動、合作，從而實現社會目標","治理與文化：銀行應直接透過總經理呼籲負責任的銀行文化，並定期對員工進行測驗，以履行其對原則的承諾","公開揭露及當責：銀行應定期評估原則的履行情況，公開揭露正面和負面影響以及對社會目標的貢獻，並對相關影響負責"],"a":2},{"id":"44024","q":"以下責任銀行原則承諾之履行步驟中，有關目標制定與實施的說明，何者是錯誤的？","o":["正式簽署 PRB 後的 12 個月內，需完成目標制定並公開","盤點銀行的業務、產品與服務，在社會、經濟與環境面向所可能帶來的最大正負面影響","目標所依循的標準與時程規劃，不應高於 SDGs、《巴黎氣候協議》以及其他國際間之永續相關原則架構","依據所盤點評估之影響範疇與目前經營環境，制定優先遵循目標與相對應之適用領域"],"a":2},{"id":"44025","q":"以下有關永續貸款原則之敘述何者是正確的？","o":["綠色貸款原則、社會責任貸款原則以及永續連結貸款原則皆是由貸款市場協會(LMA)、亞太地區貸款市場協會(APLMA)與貸款聯合組織貿易協會(LSTA)所合作制定","綠色貸款原則、社會責任貸款原則以及永續連結貸款原則皆是強制性原則","綠色貸款原則、社會責任貸款原則以及永續連結貸款原則皆無限定之貸款資金用途","綠色貸款原則、社會責任貸款原則以及永續連結貸款原則皆需設定永續發展績效目標(SPT)"],"a":0},{"id":"44026","q":"永續連結貸款原則，以下有關永續發展績效目標(SPT)的敘述是錯誤的？","o":["必須代表每個 KPI 的實質改善，且要比之前的標準好","要能與基準或外部指標相比較","可在貸款發放後設定","要與借款人整體 ESG 策略保持一致"],"a":2},{"id":"44027","q":"何者最符合綠色授信的概念？","o":["一條關於銀行授信的法規，要求所有借款人皆須符合最低 ESG 標準","一種融資形式，使借款人能將貸款用於環境保護或氣候相關支出","一條國際準則，規範銀行審核綠色企業貸款相對於總貸款金額的比例","一種獎勵機制，符合環保或低碳的企業可以向政府申請貸款利率補助"],"a":1},{"id":"44028","q":"下列有關綠色貸款與一般貸款之不同之處，何者是正確的？","o":["金融機構提供較優惠貸款利率以發展綠色貸款，其主要目的在於提升永續形象","相較於一般貸款，綠色貸款的審核較為寬鬆","相較於一般貸款，綠色貸款普遍上可享較優惠的貸款利率","企業可透過綠色貸款達成漂綠的目的"],"a":2},{"id":"44029","q":"何者不屬於綠色授信的產業範圍？","o":["再生能源發電","建置捷運與汽車專用高架橋","回收紙製程能源優化","零燃煤汽電共生"],"a":1},{"id":"44030","q":"為因應全球暖化問題，銀行業響應企業不減碳就不借錢，並更關注高排碳企業減碳作為，請問下列哪一個產業若沒有進行減碳轉型，最可能在綠色貸款中被剔除？","o":["金融業","食品業","石化業","生物科技業"],"a":2},{"id":"44031","q":"公司甲通過證券櫃檯買賣中心的認定發行綠色債籌資，請問以下何者最不可能是該債券的資金用途？","o":["能源科技發展","溫室氣體減量","生物多樣性保育","創造就業"],"a":3},{"id":"44032","q":"何者並不是推動綠色貸款可能會遇到的挑戰？","o":["綠色投資計畫項目的定義不夠清楚","須監督籌措到的資金是否被用到其他地方","銀行可能須讓利給綠色貸款項目導致利潤減少","企業可能因為永續關鍵指標未達標而無法享有優惠利率"],"a":3},{"id":"44033","q":"下列何者為社會責任貸款及綠色貸款的差異？","o":["社會責任貸款關注環境面向，綠色貸款關注社會面向","兩者皆受永續績效影響融資條件","社會責任貸款著重於基本必要服務的可取得性，綠色貸款著重於環境保護","兩者皆不須揭露資金用途"],"a":2},{"id":"44034","q":"何者並非永續連結貸款的優點？","o":["貸款資金運用比綠色貸款更有彈性","可將貸款利率連結至企業的 ESG 績效","可追蹤借款人在永續發展上是否做出實質改善","可依據公司 ESG 績效向政府請領環保津貼"],"a":3},{"id":"44035","q":"永續連結貸款(SLL)需訂立永續發展績效目標(SPT)和關鍵績效指標(KPI)，下列何者非永續發展績效目標和關鍵績效指標？","o":["生物多樣性","污染程度","溫室氣體排放量","再生能源安裝量"],"a":1},{"id":"44036","q":"何謂永續連結貸款？","o":["對於達成關鍵永續指標的貸款者，給予優惠放款利率","對於放貸給環保企業的銀行，給予較低的隔夜拆款利率","對於進行綠色信貸數目達標的銀行，給予政府優惠補助","以上皆包含於永續連結貸款範圍"],"a":0},{"id":"44037","q":"有關於永續貸款商品的敘述，下列何者正確？甲.綠色貸款及社會責任貸款皆有特定的資金用途；乙.永續績效連結貸款不需設定永續績效目標(SPTs)；丙.社會責任貸款僅能用於環境保護相關活動；丁.永續績效連結貸款的融資條件受永續績效影響","o":["僅甲、乙","僅甲、丙","僅甲、丁","僅乙、丙"],"a":2},{"id":"44038","q":"下列有關於綠色信用卡的敘述何者是正確的？","o":["可提高消費者的信用額度","可促進環保與永續發展","可減少消費時的手續費","可提高貸款的可取得性"],"a":1},{"id":"44039","q":"下列何者屬於綠色信用卡的例子？甲、將信用卡消費回饋部分投入於全球各地的環保計畫中；乙、結合信用卡平台記錄民眾的環保行為換取點數作回饋；丙、運用環保材質製作信用卡","o":["僅甲","僅甲、乙","僅甲、丙","甲、乙、丙"],"a":3},{"id":"44040","q":"下列何者為綠色存款的主要特色？",
